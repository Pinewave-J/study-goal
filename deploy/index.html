<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 允许缩放：原先的 maximum-scale=1 + user-scalable=no 会禁用双指放大，
     属于无障碍缺陷（低视力用户无法放大阅读）。输入框已统一为 16px，
     不会再触发 iOS 聚焦自动放大的问题，所以这里可以放心放开。 -->
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<!-- 移动端浏览器地址栏配色，随主题由 JS 更新 -->
<meta name="theme-color" id="theme-color" content="#6c5ce7">
<meta name="color-scheme" content="light dark">
<title>学习目标管理台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%278%27%20fill%3D%27%231864ab%27/%3E%3Cpath%20d%3D%27M9%2017.5l4.5%204.5L23%2012%27%20stroke%3D%27%23fff%27%20stroke-width%3D%273%27%20fill%3D%27none%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27/%3E%3C/svg%3E">
<!-- ============================================================
     本地存储适配器（静态部署版专用）
     ------------------------------------------------------------
     线上版由 WorkBuddy 资料库 SDK（window.__SMART_PAGE__.database）提供数据服务。
     部署到 GitHub Pages / Netlify 之后没有该 SDK，这里给出一个**接口完全一致**的
     localStorage 实现：getSchema / query / addRecord / updateRecord / deleteRecord
     均返回 Promise，页面业务逻辑零改动。
        数据落在浏览器 localStorage，键前缀 sgt_local_v1_ ，按库 ID 分表存放。
     首次打开会写入一批示例数据（可在「我的 → 数据管理 → 清空示例数据」一键清除）。
     ============================================================ -->
<script>
(function(){
'use strict';
var PREFIX='sgt_local_v1_';
var SEED_FLAG='sgt_local_seeded_v1';
var GOALS='OereifjY46k3XWmQX6KVfK';
var CHECKINS='DRuD6oQI5lrK5IhZQS1fzn';
var WEEKLIES='kVj8GOSzCqSOUhes5vYBhg';
var SCHEMAS={"OereifjY46k3XWmQX6KVfK": {"title": "学习目标", "properties": [{"name": "目标名称", "config": {"text": ""}}, {"name": "单位", "config": {"text": ""}}, {"name": "总量", "config": {"number": 0}}, {"name": "截止日期", "config": {"date": "1970-01-01T00:00:00Z"}}, {"name": "配色", "config": {"text": ""}}, {"name": "最大障碍", "config": {"text": ""}}, {"name": "应对策", "config": {"text": ""}}, {"name": "标签", "config": {"select": {"options": [{"text": "示例"}, {"text": "正常"}]}}}, {"name": "状态", "config": {"select": {"options": [{"text": "进行中"}, {"text": "已完成"}, {"text": "已归档"}]}}}, {"name": "创建日期", "config": {"date": "1970-01-01T00:00:00Z"}}]}, "DRuD6oQI5lrK5IhZQS1fzn": {"title": "打卡记录", "properties": [{"name": "目标ID", "config": {"text": ""}}, {"name": "目标名称", "config": {"text": ""}}, {"name": "日期", "config": {"date": "1970-01-01T00:00:00Z"}}, {"name": "数量", "config": {"number": 0}}, {"name": "分钟数", "config": {"number": 0}}, {"name": "是否补记", "config": {"checkbox": false}}, {"name": "备注", "config": {"text": ""}}]}, "kVj8GOSzCqSOUhes5vYBhg": {"title": "周复盘", "properties": [{"name": "周开始日期", "config": {"date": "1970-01-01T00:00:00Z"}}, {"name": "周结束日期", "config": {"date": "1970-01-01T00:00:00Z"}}, {"name": "保持", "config": {"text": ""}}, {"name": "问题", "config": {"text": ""}}, {"name": "尝试", "config": {"text": ""}}, {"name": "下周预案", "config": {"text": ""}}]}};
var SEED=[
{goal:{
 targetName:"背英语单词", unit:"个", total:2000, offsetDays:78, color:"purple",
 obstacle:"早上起不来，晚上回家只想刷手机", strategy:"如果起不来，我就改成午休时用 App 背 20 个",
},checkins:[
 {off:-9,amount:60,minutes:25,note:"地铁上刷了一遍昨天的错词"},
 {off:-8,amount:45,minutes:20,note:""},
 {off:-6,amount:80,minutes:30,note:"状态不错，多背了一组"},
 {off:-4,amount:50,minutes:22,note:""},
 {off:-3,amount:40,minutes:18,note:"加班，只背了半组"},
 {off:-2,amount:70,minutes:28,note:""},
 {off:-1,amount:55,minutes:24,note:"把上周错词过了一遍"},
]},
{goal:{
 targetName:"读《人类简史》", unit:"页", total:440, offsetDays:30, color:"blue",
 obstacle:"书太厚，翻开就觉得读不完", strategy:"如果觉得读不完，我就只要求自己读 5 页，读完随时可以停",
},checkins:[
 {off:-7,amount:22,minutes:40,note:"第三章讲认知革命，比想象中有意思"},
 {off:-5,amount:18,minutes:35,note:""},
 {off:-3,amount:25,minutes:45,note:""},
 {off:-1,amount:15,minutes:30,note:"睡前读的，容易走神"},
]},
{goal:{
 targetName:"Python 入门课", unit:"节", total:30, offsetDays:21, color:"teal",
 obstacle:"看视频会，自己写就卡住", strategy:"如果卡住，我就先照着敲一遍，不追求自己写出来",
},checkins:[
 {off:-6,amount:2,minutes:90,note:"函数那节听了两遍"},
 {off:-2,amount:1,minutes:45,note:""},
]},
];

/* ---- 底层读写 ---- */
function read(dbId){
  try{
    var raw=localStorage.getItem(PREFIX+dbId);
    var arr=raw?JSON.parse(raw):null;
    return Object.prototype.toString.call(arr)==='[object Array]'?arr:[];
  }catch(e){return []}
}
function write(dbId,arr){
  try{localStorage.setItem(PREFIX+dbId,JSON.stringify(arr));return true}
  catch(e){return false}
}
function newId(){
  return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
/* 写入用的是 {字段名:{type:value}} 包装形态，库里存的是扁平的 {字段名:value}。
   取值时按「对象里唯一的那个键」拆包，不硬编码 type 名，
   免得以后加一种字段类型又要回来改这里。 */
function unwrap(props){
  var out={};
  if(!props||typeof props!=='object')return out;
  for(var k in props){
    if(!Object.prototype.hasOwnProperty.call(props,k))continue;
    var v=props[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)){
      var ks=Object.keys(v);
      out[k]=ks.length?v[ks[0]]:v;
    }else{out[k]=v}
  }
  return out;
}
/* 统一走 setTimeout 而不是直接 resolve：SDK 是异步的，页面依赖「then 晚于当前 tick」
   这一时序（例如写入成功后才 loadAll）。同步 resolve 会让部分状态更新错序。 */
function later(fn,val){return new Promise(function(res,rej){setTimeout(function(){
  try{res(fn())}catch(e){rej(e)}
},60)})}

function seedIfEmpty(){
  var flag=false;
  try{flag=localStorage.getItem(SEED_FLAG)==='1'}catch(e){}
  if(flag)return;
  /* 只要任何一张表已经有数据，就认为不是「全新环境」，不再灌示例，
     否则用户清空数据后一刷新示例又冒出来。 */
  if(read(GOALS).length||read(CHECKINS).length||read(WEEKLIES).length){
    try{localStorage.setItem(SEED_FLAG,'1')}catch(e){}
    return;
  }
  function dkey(d){
    var y=d.getFullYear(),m=String(d.getMonth()+1),dd=String(d.getDate());
    if(m.length<2)m='0'+m; if(dd.length<2)dd='0'+dd;
    return y+'-'+m+'-'+dd;
  }
  function shift(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return dkey(d)}
  var goals=[],checkins=[],today=shift(0);
  SEED.forEach(function(s){
    var gid=newId();
    goals.push({
      _id:gid,
      '目标名称':s.goal.targetName,
      '单位':s.goal.unit,
      '总量':s.goal.total,
      '截止日期':shift(s.goal.offsetDays),
      '配色':s.goal.color,
      '最大障碍':s.goal.obstacle,
      '应对策':s.goal.strategy,
      '标签':'示例',
      '状态':'进行中',
      '创建日期':today
    });
    s.checkins.forEach(function(c){
      checkins.push({
        _id:newId(),
        '目标ID':gid,
        '目标名称':s.goal.targetName,
        '日期':shift(c.off),
        '数量':c.amount,
        '分钟数':c.minutes,
        '是否补记':false,
        '备注':c.note||''
      });
    });
  });
  write(GOALS,goals);
  write(CHECKINS,checkins);
  write(WEEKLIES,[]);
  try{localStorage.setItem(SEED_FLAG,'1')}catch(e){}
}

var DB={
  getSchema:function(args){
    return later(function(){
      return SCHEMAS[args&&args.databaseId]||{title:'',properties:[]};
    });
  },
  query:function(args){
    return later(function(){
      seedIfEmpty();
      return {results:read(args&&args.databaseId).slice()};
    });
  },
  addRecord:function(args){
    return later(function(){
      var dbId=args&&args.databaseId, rec=unwrap(args&&args.properties);
      rec._id=newId();
      var arr=read(dbId); arr.push(rec);
      if(!write(dbId,arr))throw new Error('localStorage write failed');
      notify();
      return {recordId:rec._id,record:rec};
    });
  },
  updateRecord:function(args){
    return later(function(){
      var dbId=args&&args.databaseId, id=args&&args.recordId;
      var arr=read(dbId), patch=unwrap(args&&args.properties), hit=null;
      for(var i=0;i<arr.length;i++){
        if(arr[i]._id===id){for(var k in patch){
          if(Object.prototype.hasOwnProperty.call(patch,k))arr[i][k]=patch[k];
        } hit=arr[i];break}
      }
      if(!hit)throw new Error('record not found: '+id);
      if(!write(dbId,arr))throw new Error('localStorage write failed');
      notify();
      return {recordId:id,record:hit};
    });
  },
  deleteRecord:function(args){
    return later(function(){
      var dbId=args&&args.databaseId, id=args&&args.recordId;
      var arr=read(dbId);
      var next=arr.filter(function(r){return r._id!==id});
      write(dbId,next);
      notify();
      return {recordId:id,deleted:arr.length!==next.length};
    });
  }
};

/* 多标签页同步：另一个标签页改了数据，这边跟着刷新。
   window.loadAll 是页面自己挂出来的入口，可直接调。 */
function notify(){
  try{localStorage.setItem('sgt_local_touch',String(Date.now()))}catch(e){}
}
window.addEventListener('storage',function(e){
  if(!e||!e.key||e.key.indexOf(PREFIX)!==0&&e.key!=='sgt_local_touch')return;
  if(typeof window.loadAll==='function'){try{window.loadAll()}catch(err){}}
});

window.__SMART_PAGE__=window.__SMART_PAGE__||{};
window.__SMART_PAGE__.database=DB;
/* 备份 / 迁移用的读写出口，供页面底部注入的备份卡片调用 */
window.__SGT_LOCAL__={
  prefix:PREFIX, ids:{goals:GOALS,checkins:CHECKINS,weeklies:WEEKLIES},
  read:read, write:write, reseed:function(){
    [GOALS,CHECKINS,WEEKLIES].forEach(function(id){write(id,[])});
    try{localStorage.removeItem(SEED_FLAG)}catch(e){}
    seedIfEmpty();
  }
};
})();
</script>

<style>
/* ============================================================
   设计令牌（Design Tokens）
   ------------------------------------------------------------
   所有颜色 / 圆角 / 阴影 / 字号都收敛到这里，组件规则一律引用变量，
   不再出现硬编码色值。这样切换主题只需覆盖同名变量，
   组件样式一行都不用改 —— 这是「一套结构、两套皮」的前提。

   分层顺序：表面 → 文字 → 品牌 → 语义 → 数据可视化 → 装饰 → 形状
   ============================================================ */
:root{
  color-scheme:light;

  /* —— 表面层级 L0→L3：靠「递进亮度」表达高度，而不是靠阴影 —— */
  /* —— 表面层级 L0→L3：靠「递进亮度」表达高度，而不是靠阴影 ——
     浅色下 L0 是冷灰白、L1 是纯白卡片，两档色差很小，
     所以卡片必须靠 1px 描边（--card-border）把边界画出来。
     这是 Homarr / Mantine 那套仪表盘观感的关键：先有边，再有层次。 */
  --bg:#f6f7f9;              /* L0 页面底色 */
  --card:#ffffff;            /* L1 卡片 */
  --surface-2:#f1f3f5;       /* L2 卡内浅槽（统计格 / 计划区 / 提示块） */
  --surface-3:#e9ecef;       /* L3 更深一档（hover / 按下） */
  --border:#e4e7eb;          /* 分隔线、描边 */
  --border-strong:#c8cfd6;   /* 需要更明确边界时 / 卡片 hover */
  --card-border:#e7eaee;     /* 卡片外描边：两套主题下都显形，不再是 transparent */
  --field-bg:#ffffff;        /* 输入框底色 */

  /* —— 文字三层级：主 / 次 / 最弱 —— */
  --text:#1f2328;            /* 对卡片底 15.4:1 */
  --muted:#5b6470;           /* 6.1:1 */
  --faint:#8b939c;           /* 占位符/刻度：3.1:1，够「弱」也够「看得见」 */

  /* —— 品牌色：中性蓝（对齐 Homarr / Mantine 的蓝系）
     取值要同时满足三个方向 ≥4.5:1：
       · 对白底 6.09:1        —— 当文字用（今日标签、链接、分组标题图标）
       · 白字压其上 6.09:1     —— 当实心按钮底色用
       · 对 --primary-bg 5.34:1 —— 当徽标/浅底块上的文字用
     上一版取更亮的 #1971c2 时，压在浅蓝底上只有 4.38:1，徽标文字是不合格的。 */
  --primary:#1864ab;
  --primary-l:#4dabf7;
  --primary-hover:#14548c;
  --primary-bg:#e7f1ff;
  --brand:#1864ab;           /* 兼容别名：原代码用了 var(--brand) 但从未定义，
                                该处样式一直在静默失效，这里补上 */
  --on-primary:#ffffff;      /* 压在品牌实色上的文字色 */
  --on-solid:#ffffff;        /* 压在语义实色（成功/危险/警告）上的文字色 */
  --focus-ring:rgba(24,100,171,.28);

  /* —— 顶栏 / 侧栏头部底色 ——
     两套主题都是「中性表面 + 1px 下边框」的工具条，不再是品牌色渐变条：
     仪表盘里一条大面积彩色顶栏会把注意力从数据上拉走，Homarr 也是中性 header。
     这两个令牌同时被 <meta name="theme-color"> 读取（移动端地址栏配色），
     applyTheme 直接取 --header-from，所以改这里地址栏会跟着变。 */
  --header-from:#ffffff;
  --header-to:#fcfcfd;
  --on-accent:#1f2328;
  --on-accent-soft:rgba(15,23,42,.06);   /* 顶栏上控件的底 */
  --on-accent-hover:rgba(15,23,42,.11);

  /* —— 语义色 ——
     这三个色既要当「浅底上的文字」（徽标、连续天数、补记标、提醒文案），
     又要当「实心按钮的底」（打卡、立即打卡、确认清空）。所以取值必须
     同时满足两个方向 ≥4.5:1 —— 对白底的对比度、以及白字压在它上面的对比度。
     原来的 #00b894 / #e74c3c / #f39c12 两个方向都只有 2.0~3.8:1，
     属于「一直都在、但一直没被指出」的可读性欠账。 */
  --success:#047a58;--success-bg:#e6f5ef;   /* 双向 5.35:1 */
  --danger:#c0392b;--danger-bg:#fdecea;      /* 双向 5.44:1 */
  --amber:#9c5c08;--amber-bg:#fdf3e3;        /* 双向 5.36:1 */

  /* —— 热力图色阶（0 = 当天无记录，1→4 = 投入递增）：与主色同系的蓝色阶 —— */
  --heat-0:#e9ecef;--heat-1:#cfe6fb;--heat-2:#a5d3f6;--heat-3:#4dabf7;--heat-4:#1971c2;

  /* —— 目标配色（用户建目标时六选一）——
     gc  = 主色：用于色点、进度条、左侧色条、图表柱等「色块」
     gci = 墨色：用于把该色当**文字**时（已完成量、剩余量、建议量、完成率数字）
     gcl = 浅档　gcbg = 浅底
     为什么要分 gc / gci：一个颜色能当色块，不代表它能当文字。
     亮青绿 #00cec9 当色点很好认，但当文字压在白底上只有 1.97:1 —— 几乎看不见。
     所以文字一律走 gci（对白底 ≥4.7:1），色块继续用亮色保住辨识度。
     这些做成 CSS 令牌而不是写死在 JS，是为了让「切主题」只靠 CSS 生效，
     不必重新渲染整页（否则切主题后所有目标卡都要重画一遍）。
     ⚠️ 新增配色时，:root 与 [data-theme="dark"] 两处都要补齐，否则会退到兜底色。 */
  --gc-purple:#6c5ce7;--gci-purple:#5b4bd0;--gcl-purple:#a29bfe;--gcbg-purple:#f0edff;
  --gc-blue:#0984e3;--gci-blue:#0b6fc2;--gcl-blue:#74b9ff;--gcbg-blue:#e8f4fd;
  --gc-green:#00a37e;--gci-green:#047a58;--gcl-green:#55efc4;--gcbg-green:#e0f5f0;
  --gc-orange:#e17055;--gci-orange:#c1502f;--gcl-orange:#fab1a0;--gcbg-orange:#fef0eb;
  --gc-pink:#e84393;--gci-pink:#c2185b;--gcl-pink:#fd79a8;--gcbg-pink:#fdf0f5;
  --gc-teal:#00a09c;--gci-teal:#0d7d78;--gcl-teal:#81ecec;--gcbg-teal:#e0f5f5;

  /* 卡片顶部色条的取色口（.card-accent）。每张目标卡用自己的内联
     style="--accent:该目标配色" 覆盖它；这里必须给一个默认值，
     万一某张卡漏了内联值，色条会退回品牌色，而不是整条消失（未定义令牌是静默失效）。 */
  --accent:var(--primary);

  /* —— 装饰：阴影 / 遮罩 / 浮层 ——
     仪表盘风格里层次主要由描边承担，阴影只留给真正「浮起来」的元素（模态、toast、
     移动端底部导航），常态卡片一律不用阴影 —— 否则一屏十几张卡各带一团阴影，页面会发脏。 */
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 16px 40px rgba(16,24,40,.18);
  --shadow-nav:0 -2px 10px rgba(16,24,40,.06);
  --shadow-overdue:0 0 0 1px rgba(192,57,43,.45);   /* 逾期：用一圈红描边强调，不用红色光晕 */
  --overlay:rgba(23,26,33,.45);
  /* 提示条独立令牌：原实现直接拿 --text 当底色，
     暗色下 --text 会变成亮色 → 白底白字。必须与文字色解耦。 */
  --toast-bg:#1f2328;--toast-text:#ffffff;--toast-border:transparent;
  --ring:#ffffff;            /* 色板选中态的内圈描边 */

  /* —— 形状与字号阶 ——
     小圆角是仪表盘观感的另一半：14px→8px 之后，卡片从「圆润的移动端卡片」
     变成「密度更高的数据面板」，这是本次参照 Homarr 的核心改动之一。 */
  --radius-sm:6px;--radius:8px;--radius-lg:12px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:14px;--fs-md:15px;--fs-lg:17px;--fs-xl:22px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;

  /* —— 动效令牌 ——
     与主题无关（深浅两套皮共用同一套节奏），所以只定义在 :root，暗色块不覆写。
     按钮动效层只允许用这 2 条曲线 + 4 档时长，动效风格才不会散。 */
  --ease-std:cubic-bezier(.4,0,.2,1);        /* 通用进出：扫入 / 涟漪 / 换色 */
  --ease-spring:cubic-bezier(.34,1.56,.64,1);/* 弹簧回弹：按压 / 成功回弹 */
  --motion-press:160ms;   /* 按压 */
  --motion-quick:260ms;   /* 悬停类 */
  --motion-morph:420ms;   /* 形变 */
  --motion-long:620ms;    /* 涟漪 / 转圈 */
}

/* ============================================================
   暗色主题（默认主题）
   ------------------------------------------------------------
   参照 Homarr / Mantine 的深色阶，三条原则：
   ①  层次用「亮度阶 + 1px 描边」表达，不依赖阴影 —— 暗底上阴影几乎
      不可见，卡片若只靠阴影会糊成一片。故 --card-border 在这里常驻显形。
   ②  品牌色整体「提亮」：浅色主色 #1971c2 压在深底上只有 3.4:1，
      文字和图标都会发闷。故暗色把 --primary 换成亮档 #4dabf7，
      并把「压在品牌色上的文字」翻转为深色（--on-primary）。
   ③  语义色同向处理：前景提亮、底色压深，保证正文 ≥4.5:1。
   ============================================================ */
[data-theme="dark"]{
  color-scheme:dark;

  /* 表面：从近黑逐级抬升（#131417 → #1a1b1e → #212226 → #2a2b30） */
  --bg:#131417;
  --card:#1a1b1e;
  --surface-2:#212226;
  --surface-3:#2a2b30;
  --border:#2b2d32;
  --border-strong:#3d4046;
  --card-border:#282a2f;
  --field-bg:#1e1f23;

  /* 文字：主文字对卡片底约 13:1，次要约 6:1，均达 WCAG AA */
  --text:#e6e7ea;
  --muted:#a1a4ab;
  --faint:#6e727a;

  /* 品牌：提亮 + 前景翻转 */
  --primary:#4dabf7;
  --primary-l:#74c0fc;
  --primary-hover:#74c0fc;
  --primary-bg:#12293c;
  --brand:#4dabf7;
  --on-primary:#08131c;
  --on-solid:#14161c;
  --focus-ring:rgba(77,171,247,.45);

  /* 顶栏/侧栏头部：比页面底亮一档，靠下边框与内容分开 */
  --header-from:#1a1b1e;
  --header-to:#17181b;
  --on-accent:#e6e7ea;
  --on-accent-soft:rgba(255,255,255,.07);
  --on-accent-hover:rgba(255,255,255,.13);

  /* 语义色：前景提亮、底色压深 */
  --success:#3ddc97;--success-bg:#12352a;
  --danger:#ff7b72;--danger-bg:#3a2022;
  --amber:#ffb020;--amber-bg:#3a2c12;

  /* 热力图：0 级必须比卡片底更深才看得出「这是空格」，
     4 级用提亮后的品牌色，保证整条色阶在暗底上都可辨 */
  --heat-0:#22242a;--heat-1:#17324a;--heat-2:#1f5486;--heat-3:#2f86c9;--heat-4:#4dabf7;

  /* 目标配色：主色统一提亮到在深底上也能当文字用（对卡片底 ≥6:1），
     浅底反过来压深成「同色系暗底」，保住「这个颜色代表这个目标」的识别度。 */
  --gc-purple:#a99cff;--gci-purple:#a99cff;--gcl-purple:#c7c1ff;--gcbg-purple:#262254;
  --gc-blue:#5eb3f6;--gci-blue:#5eb3f6;--gcl-blue:#8fcbff;--gcbg-blue:#12304d;
  --gc-green:#4ce0a5;--gci-green:#4ce0a5;--gcl-green:#8af0c6;--gcbg-green:#12352a;
  --gc-orange:#ff9d7e;--gci-orange:#ff9d7e;--gcl-orange:#ffbea8;--gcbg-orange:#3b241c;
  --gc-pink:#ff7fc0;--gci-pink:#ff7fc0;--gcl-pink:#ffa8d2;--gcbg-pink:#3b1a2c;
  --gc-teal:#4fe3de;--gci-teal:#4fe3de;--gcl-teal:#8af0ec;--gcbg-teal:#0f3534;
  --accent:var(--primary);   /* 卡片顶部色条的默认取色口，见 :root 里的说明 */

  /* 装饰：阴影加深但仍保留（供浮层使用），常态卡片层次交给描边 */
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 18px 44px rgba(0,0,0,.66);
  --shadow-nav:0 -2px 12px rgba(0,0,0,.5);
  --shadow-overdue:0 0 0 1px rgba(255,123,114,.5);
  --overlay:rgba(0,0,0,.66);
  --toast-bg:#2b2d33;--toast-text:#f1f3f8;--toast-border:rgba(255,255,255,.10);
  --ring:#131417;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  /* 主题切换时底色与文字做一次柔和过渡，避免整页闪跳 */
  transition:background-color .25s ease,color .25s ease;
}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* —— 选中文字：用品牌色浅底，两套主题都成立 —— */
::selection{background:var(--primary-bg);color:var(--primary)}
[data-theme="dark"] ::selection{color:var(--text)}

/* —— 键盘焦点环：只在键盘操作时出现，不影响鼠标点击的观感 ——
   原来是完全没有的，表单以外的地方键盘无法定位，属于无障碍缺口。 */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
.btn:focus-visible,.nav-item:focus-visible{outline-offset:3px}

/* —— 桌面端滚动条：默认样式在暗色下是一根突兀的浅灰条 —— */
@media(min-width:769px){
  .content{scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
  .content::-webkit-scrollbar{width:9px;height:9px}
  .content::-webkit-scrollbar-track{background:transparent}
  .content::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:5px;border:2px solid var(--bg)}
  .content::-webkit-scrollbar-thumb:hover{background:var(--faint)}
}

/* —— 尊重系统「减少动效」偏好：动效敏感用户不应被彩带和位移打扰 —— */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti-piece{display:none}
  /* 涟漪是靠 JS 现插节点 + animation 播的，压到 .01ms 会留下一个静止的墨点，
     不如直接不显示。按钮的按压色变仍在，反馈不会丢。 */
  .ripple{display:none}
  /* spinner 同理：0.01ms 的旋转会变成一个卡住的半环，看着像渲染坏了 */
  .btn.is-busy::after{display:none}
}

/* Layout
   两套骨架，同一段 HTML：
   · ≥1025px —— 左侧栏（品牌区 + 导航 + 底部工具）｜右侧内容（吸顶工具条 + 面板）
   · ≤1024px —— 顶部品牌条（含工具）+ 内容 + 底部固定导航
   靠媒体查询切换形态，不维护两份 DOM。 */
#app{min-height:100vh;display:flex;flex-direction:column}

/* --- 品牌条 / 侧栏头部 ---
   移动端：吸顶的顶部条，品牌 + 工具（同步状态、主题）都在这一行。
   桌面端：退化为侧栏里的品牌区，工具整套搬到内容区的吸顶工具条上。
   两处的同步徽标 / 主题按钮是两段独立 DOM，共用 js-sync-badge / js-theme-btn 类名，
   由 JS 同时更新两处，不会出现「只有一处被更新」的半死状态。 */
.app-header{position:sticky;top:0;z-index:70;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(180deg,var(--header-from),var(--header-to));color:var(--on-accent);border-bottom:1px solid var(--border);flex-shrink:0}
.app-header .brand-mark{flex-shrink:0;display:block}
.app-header .brand-name{font-size:var(--fs-md);font-weight:600;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.header-tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
.app-header .sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);padding:4px 9px;border-radius:999px;background:var(--on-accent-soft);color:var(--text);white-space:nowrap;flex-shrink:0;min-width:0}
.app-header .sync-badge svg{width:12px;height:12px;flex-shrink:0}
.app-header .sync-badge .sb-label{overflow:hidden;text-overflow:ellipsis}
/* 状态配色用 0,3,0 的权重写全（底 + 字）：
   下面还有一条通用的 .sync-badge.xxx 底色规则（0,2,0），
   若这里只写 color，背景会被那条通用规则接管，顶栏徽标的底色就不是这里想要的了。 */
.app-header .sync-badge.synced{color:var(--success);background:var(--success-bg)}
.app-header .sync-badge.syncing{color:var(--primary);background:var(--primary-bg)}
.app-header .sync-badge.offline{color:var(--danger);background:var(--danger-bg)}

/* --- 主题切换按钮：方形小按钮，与工具条上其他图标按钮同一形态 --- */
.theme-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--radius-sm);cursor:pointer;padding:0;background:var(--on-accent-soft);border:1px solid transparent;color:var(--text);transition:background .16s,color .16s}
.theme-btn:hover{background:var(--on-accent-hover)}
.theme-btn:active{transform:scale(.94)}

/* --- 内容区：吸顶工具条 + 面板 --- */
.content{flex:1;overflow-y:auto;padding:0 14px 12px;max-width:100%}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 吸顶工具条：Homarr 式的内容区头部（当前模块 + 工具 + 主操作）。
   负 margin 抵消 .content 的横向内边距，让它通铺到内容区两侧。
   ⚠️ 移动端不能吸顶：那一层是「页面」在滚动，吸顶会与上方品牌条叠在一起。 */
.topbar{display:flex;align-items:center;gap:10px;margin:0 -14px 14px;padding:11px 14px;background:var(--bg);border-bottom:1px solid var(--border)}
.topbar-title{display:flex;align-items:center;gap:8px;min-width:0;font-size:var(--fs-md);font-weight:600}
.topbar-title svg{color:var(--primary);flex-shrink:0;display:block}
.topbar-title h1{margin:0;font-size:var(--fs-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0}
/* 工具条里的同步状态与主题按钮只在桌面显示 —— 窄屏这两个已经在顶部品牌条上了。
   ⚠️ 这条必须排在 .topbar .sync-badge / .topbar .theme-btn 之后（同为 0,2,0 权重，后出现的赢），
      排前面会被下面的 display:inline-flex 反压回去，窄屏就会顶着两个同步徽标。 */
.topbar .sync-badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-sm);padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.topbar .sync-badge.synced{color:var(--success);background:var(--success-bg);border-color:transparent}
.topbar .sync-badge.syncing{color:var(--primary);background:var(--primary-bg);border-color:transparent}
.topbar .sync-badge.offline{color:var(--danger);background:var(--danger-bg);border-color:transparent}
.topbar .theme-btn{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.topbar .theme-btn:hover{background:var(--surface-3)}
.topbar-tools .sync-badge,.topbar-tools .theme-btn{display:none}

/* --- 分组容器：Homarr 的 category（小字标题 + 字距 + 右侧细线） --- */
.gs-section{margin-bottom:18px}
.gs-section:last-child{margin-bottom:0}

/* --- 侧栏底部（仅桌面）：同步入口 + 一句说明 --- */
.sidebar-foot{display:none;margin-top:auto;padding:12px;border-top:1px solid var(--border);flex-direction:column;gap:8px}
.sidebar-note{font-size:var(--fs-xs);color:var(--muted);line-height:1.5}

/* Nav */
.nav{display:flex;flex-shrink:0;background:var(--card);border-top:1px solid var(--border)}
.nav-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;background:none;border:none;cursor:pointer;color:var(--muted);transition:color .16s,background .16s;min-height:52px;min-width:44px}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:20px;height:20px}
.nav-item span{font-size:var(--fs-xs)}
/* 移动端：激活项顶部一小段横线，扫读时比单纯换色更容易定位 */
.nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:2px;border-radius:0 0 2px 2px;background:var(--primary)}

/* Desktop */
@media(min-width:1025px){
  #app{flex-direction:row}
  .sidebar{width:248px;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);position:sticky;top:0;height:100vh}
  /* 侧栏头部只留品牌：工具已搬进内容区工具条 */
  .app-header{position:static;padding:16px;background:transparent;border-bottom:1px solid var(--border)}
  .app-header .brand-name{font-size:var(--fs-base)}
  .app-header .header-tools{display:none}
  .content{padding:0 28px 28px;max-width:1320px}
  .topbar{position:sticky;top:0;z-index:60;margin:0 -28px 16px;padding:14px 28px}
  .topbar-tools .sync-badge{display:inline-flex}
  .topbar-tools .theme-btn{display:inline-flex}
  .nav{flex-direction:column;border-top:none;flex:1;padding:8px;gap:2px;overflow-y:auto}
  .nav-item{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);font-size:var(--fs-base);font-weight:500;min-height:38px}
  .nav-item:hover{background:var(--surface-2);color:var(--text)}
  .nav-item.active{background:var(--primary-bg);color:var(--primary);font-weight:600}
  .nav-item.active::before{display:none}
  .nav-item span{font-size:var(--fs-base)}
  .nav-item svg{width:18px;height:18px}
  .sidebar-foot{display:flex}
}

/* Tablet */
@media(min-width:769px) and (max-width:1024px){
  #app{flex-direction:column}
  .nav{flex-direction:row;padding:0 12px}
  .nav-item{flex:1;flex-direction:row;justify-content:center;gap:8px}
  .nav-item svg{width:18px;height:18px}
  .nav-item span{font-size:var(--fs-sm)}
  .content{padding:0 20px 24px;max-width:1000px;margin:0 auto}
  .topbar{margin:0 -20px 16px;padding:12px 20px}
  .app-header{padding:12px 20px}
}

/* Mobile */
@media(max-width:768px){
  #app{padding-bottom:0}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:100;box-shadow:var(--shadow-nav);padding-bottom:env(safe-area-inset-bottom)}
  .content{padding:0 12px 12px;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .topbar{margin:0 -12px 12px;padding:10px 12px}
  .nav-item span{font-size:var(--fs-xs)}
}
/* 超窄屏（≤400px）：同步徽标只留图标，把文字收起来，优先保证标题和工具不被挤掉 */
@media(max-width:400px){
  .app-header{gap:6px;padding:10px}
  .app-header .brand-name{font-size:var(--fs-base)}
  .app-header .sync-badge .sb-label{display:none}
  .app-header .sync-badge{padding:5px 7px}
  .topbar-title h1{font-size:var(--fs-base)}
}

/* Cards
   仪表盘式卡片：靠 1px 描边分层，常态不投影（一屏十几张卡各带一团阴影会发脏）；
   hover 只让描边变亮一档，避免卡片「跳起来」干扰阅读。
   顶部 3px 色条（.card-accent）替代原来左边 4px 的粗色条：
   颜色仍然代表目标，但在网格里不再把每张卡片的左边缘切碎。 */
.card{position:relative;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px;transition:background-color .2s ease,border-color .16s ease}
.card:hover{border-color:var(--border-strong)}
.card-body{padding:14px}
.card-accent{position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--primary))}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.color-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
/* 目标头像块：底色/墨色都来自目标的配色令牌，首字提供一眼可辨的标识。
   比原来那个 12px 的小圆点信息量大得多，也顺手把卡片头部「立」起来了。 */
.goal-avatar{width:30px;height:30px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;line-height:1;background:var(--surface-2);color:var(--muted)}
.goal-name{font-size:var(--fs-md);font-weight:600;flex:1;min-width:0;word-break:break-word;line-height:1.35}

/* Progress bar */
.progress{height:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin-bottom:12px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* Stats —— 数字统一用等宽数字（tabular-nums），
   否则「1」和「24」切换时整行会轻微抖动 */
.stats-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{flex:1;min-width:80px;text-align:center;padding:8px 4px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.stat-num{font-size:18px;font-weight:600;line-height:1.25;font-variant-numeric:tabular-nums}
.stat-label{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}

/* Buttons
   主按钮用实色而不是渐变：仪表盘里渐变会跟数据争夺注意力，
   而且实色 --primary 双向对比度都过 4.5:1，白字压上去最稳。 */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border:1px solid transparent;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--fs-base);font-weight:500;transition:background .16s,color .16s,border-color .16s,transform .12s;min-height:38px}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-success{background:var(--success);color:var(--on-solid)}
.btn-danger{background:var(--danger);color:var(--on-solid)}
.btn-amber{background:var(--amber);color:var(--on-solid)}
.btn-outline{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.btn-outline:hover{background:var(--surface-3)}
.btn-outline:active{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:var(--fs-sm);min-height:34px}
.btn-block{width:100%}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;padding:6px;min-height:32px;min-width:32px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--muted);border-radius:var(--radius-sm);transition:background .16s,color .16s,border-color .16s}
.btn-icon:hover{background:var(--surface-2);color:var(--text);border-color:var(--border)}
.btn-icon.danger:hover,.btn-icon.danger:active{color:var(--danger);background:var(--danger-bg);border-color:transparent}

/* Forms
   ⚠️ 字号必须是 16px：iOS Safari 对 <16px 的输入框会自动放大整页，
   用户点一下输入框页面就跳缩，是移动端最恼人的体验问题之一。 */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--field-bg);color:var(--text);transition:border-color .16s,background-color .2s}
.form-input:hover,.form-select:hover,.form-textarea:hover{border-color:var(--border-strong)}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.form-input::placeholder,.form-textarea::placeholder{color:var(--faint)}
.form-textarea{min-height:60px;resize:vertical}
.form-hint{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}
/* 目标没设截止日时，卡片上标出来（不再是偷偷显示成「今天到期」） */
.no-deadline{color:var(--amber);font-weight:500}

/* Today section
   分组标题（Homarr 的 category 标题）：小字 + 字距 + 右侧一条细线。
   细线把标题与它下面的内容「划」在同一组里，比加粗大字更省视觉预算。 */
.section-title{font-size:var(--fs-sm);font-weight:600;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:7px}
.section-title svg{color:var(--faint);flex-shrink:0}
.section-title::after{content:'';flex:1;height:1px;min-width:10px;background:var(--border)}
/* 提醒卡：底色全部走语义浅底令牌，左描边承担「哪一类」的辨识 */
.alert-card{padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.alert-card.red{background:var(--danger-bg);border-left:3px solid var(--danger)}
.alert-card.yellow{background:var(--amber-bg);border-left:3px solid var(--amber)}
.alert-card.blue{background:var(--primary-bg);border-left:3px solid var(--primary)}
.alert-card.green{background:var(--success-bg);border-left:3px solid var(--success)}
.alert-text{flex:1;font-size:13px;line-height:1.5}
.alert-text strong{display:block;font-size:var(--fs-base);margin-bottom:2px}
/* 黄卡里带图标时，标题行图标与文字对齐（needLoginNoticeHtml 用了 ic('lock')） */
.alert-card .alert-text>svg{vertical-align:-3px;margin-right:4px;color:var(--amber);flex-shrink:0}
.alert-card.red .alert-text>svg{color:var(--danger)}
/* 只读模式下不可用的控件要一眼看出来，不能只是点不动 */
.btn:disabled,.color-opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed;pointer-events:none}

/* Quick checkin */
.quick-checkin{display:flex;gap:8px;align-items:center;margin-top:8px}
.quick-checkin input{width:70px;padding:8px;text-align:center;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--field-bg);color:var(--text)}
.quick-checkin .unit{font-size:13px;color:var(--muted)}
.quick-checkin .btn{flex-shrink:0}

/* Plan section */
.plan-section{margin-top:10px;padding:10px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:13px}
.plan-row{margin-bottom:6px}
.plan-row:last-child{margin-bottom:0}
.plan-label{font-weight:600;color:var(--muted);margin-right:4px}
.plan-value{color:var(--text)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-overlay.hidden{display:none}
.modal-content{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);width:100%;max-width:460px;max-height:85vh;overflow-y:auto;padding:20px;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:var(--fs-lg);font-weight:600}
.modal-close{background:none;border:none;cursor:pointer;padding:4px;color:var(--muted);border-radius:6px}

/* Toast
   ⚠️ 原实现用 background:var(--text) —— 暗色下 --text 会变成亮色，
   于是提示条成了「浅底 + 白字」，直接看不见。这里拆成独立令牌。 */
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100vw - 32px);background:var(--toast-bg);color:var(--toast-text);border:1px solid var(--toast-border);padding:10px 20px;border-radius:var(--radius-sm);z-index:300;font-size:var(--fs-base);box-shadow:var(--shadow-lg);transition:opacity .3s}
.toast.hidden{opacity:0;pointer-events:none}
.toast.error{background:var(--danger);color:var(--on-solid);border-color:transparent}
.toast.success{background:var(--success);color:var(--on-solid);border-color:transparent}

/* Sync status */
.sync-badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-sm);padding:3px 8px;border-radius:999px}
.sync-badge.synced{background:var(--success-bg);color:var(--success)}
.sync-badge.syncing{background:var(--primary-bg);color:var(--primary)}
.sync-badge.offline{background:var(--danger-bg);color:var(--danger)}

/* Progress ring */
.progress-ring-wrap{display:flex;align-items:center;gap:16px}
.progress-ring{flex-shrink:0}

/* Chart */
.chart-wrap{margin-top:16px}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:8px}
.legend-item{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.legend-dot{width:8px;height:8px;border-radius:2px}

/* Records list
   移动端没有 hover，删除按钮不能只在 hover 时才出现，否则手机上永远删不掉，
   故在窄屏常驻显示（见下方媒体查询）。 */
.record-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;transition:background .2s}
.record-item:hover{background:var(--surface-2)}
.record-date{color:var(--muted);font-size:var(--fs-sm);min-width:70px}
.record-amt{font-weight:600;font-variant-numeric:tabular-nums}
.record-min{color:var(--muted);font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.record-tag{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--amber-bg);color:var(--amber)}
.record-del{margin-left:auto;opacity:0;transition:opacity .2s}
.record-item:hover .record-del{opacity:1}
/* ===== 学习备注（第十二阶段） =====
   备注是「每条打卡记录」的自由文本：第几页到第几页、掌握了哪个 API、看了哪一讲。
   展示上让它**单独占一行**，不塞进 .record-item 的横向 flex ——
   记录行本来就有「色点 / 目标名 / 数量 / 用时 / 删除」五段，再挤一段正文，
   目标名会被压成一格宽、长备注也会把整行撑变形。
   所以外面包一层 .rec-wrap（记录行 + 备注行各占一行），
   并把整行高亮从 .record-item 上移到 .rec-wrap —— 否则鼠标移到备注上高亮会断掉。 */
.rec-wrap{border-radius:var(--radius-sm)}
.rec-wrap:hover{background:var(--surface-2)}
.rec-note{display:flex;align-items:flex-start;gap:6px;padding:0 10px 9px;font-size:var(--fs-sm);line-height:1.6;color:var(--muted)}
.rec-note-ic{flex:0 0 auto;margin-top:2px;color:var(--faint)}
.rec-note-text{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.rec-note-empty{color:var(--faint)}
/* 备注行整行可点即可编辑（不做成独立小按钮：小按钮在手机上够不到 44px）。
   用虚线下划线 + 右侧编辑图标暗示「这里能点」，鼠标悬停整行变主色。 */
.rec-note-editable{cursor:pointer}
.rec-note-editable .rec-note-text{text-decoration:underline dotted var(--border-strong);text-underline-offset:3px}
.rec-note-editable:hover .rec-note-text{color:var(--primary)}
.rec-note-edit-ic{flex:0 0 auto;margin-top:2px;color:var(--faint);transition:color .2s}
.rec-note-editable:hover .rec-note-edit-ic{color:var(--primary)}
/* 「最近动态」里的备注：那里是紧凑流水，不套 .rec-note 的横向 padding，
   改为目标名下方一行小字，最多两行、超出省略（全量内容在最近记录 / 周报明细 / 学习日志里看）。
   title 属性带上全文，鼠标悬停仍能读完整。 */
.feed-note{margin-top:2px;font-size:var(--fs-sm);color:var(--text);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.learning-log .log-day{margin-top:12px}
.learning-log .log-day-head{display:flex;align-items:baseline;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.learning-log .log-day-sum{margin-left:auto;font-weight:400;font-size:var(--fs-xs)}
.learning-log .log-item{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border-radius:var(--radius-sm);font-size:13px}
.learning-log .log-item:hover{background:var(--surface-2)}
.learning-log .log-body{flex:1;min-width:0}
.learning-log .log-meta{color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}
/* 日志里的备注行也是可点的（补写/修改），必须给出「能点」的两个信号：
   手型光标 + 悬停变主色。少了 cursor 就是「能点但看不出来」——
   线上实测过一次：role/tabindex/onclick 都在，光标却是 auto，等于把入口藏起来了。 */
.learning-log .log-note{margin-top:3px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.learning-log .log-note:hover{color:var(--primary)}
.learning-log .log-note.is-empty{color:var(--faint)}
@media(hover:none){
  .record-del{opacity:1}
}

/* Confetti */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;z-index:500;border-radius:2px;animation:confetti-fall 3s ease-in forwards}
@keyframes confetti-fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* Empty */
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:var(--fs-base)}
.empty svg{margin-bottom:8px;opacity:.45}

/* Weekly */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.week-display{font-size:var(--fs-md);font-weight:600}
.week-summary{display:flex;gap:8px;margin-bottom:16px}
.week-stat{flex:1;text-align:center;padding:11px 8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
.week-stat-num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3}
.week-stat-label{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.week-compare{font-size:13px;color:var(--muted);margin-bottom:16px;padding:8px 12px;background:var(--surface-2);border-radius:var(--radius-sm);line-height:1.7}

/* Misc */
.divider{height:1px;background:var(--border);margin:12px 0}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.skeleton-h{height:16px;background:linear-gradient(90deg,var(--border) 25%,var(--surface-2) 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tag{display:inline-block;font-size:var(--fs-xs);padding:2px 7px;border-radius:4px;background:var(--primary-bg);color:var(--primary);margin-left:6px}
.tag.amber{background:var(--amber-bg);color:var(--amber)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .2s,box-shadow .2s}
/* 选中态：内圈用页面底色、外圈用主色，在浅色与暗色下都读得出来 */
.color-opt.selected{border-color:var(--ring);box-shadow:0 0 0 2px var(--primary)}
.instructions{background:var(--surface-2);border-radius:var(--radius-sm);padding:16px;font-size:13px;line-height:1.8}
.instructions ol{padding-left:20px}
.instructions li{margin-bottom:4px}

/* ===== 卡片标题 / 分区徽标 ===== */
.card-title{display:flex;align-items:center;gap:6px;padding:14px 16px 0;font-size:var(--fs-base);font-weight:600}
.card-title-note{margin-left:auto;font-size:var(--fs-sm);font-weight:400;color:var(--muted)}
.card-title-note b{color:var(--primary);font-variant-numeric:tabular-nums}
.mini-title{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin:10px 0 4px}
.sec-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:var(--primary-bg);color:var(--primary);font-size:var(--fs-xs);font-weight:600;margin-left:4px}
.tiny{font-size:var(--fs-sm);color:var(--muted);padding:8px 16px 14px}

/* ===== 目标卡：徽标 / 汇总行 / 状态 ===== */
.badge{display:inline-flex;align-items:center;font-size:var(--fs-xs);font-weight:500;padding:2px 7px;border-radius:4px;flex-shrink:0;white-space:nowrap}
.badge-done{background:var(--success-bg);color:var(--success)}
.badge-overdue{background:var(--danger-bg);color:var(--danger)}
.badge-today{background:var(--primary-bg);color:var(--primary)}
.goal-line{font-size:13px;color:var(--muted);line-height:1.7;word-break:break-word}
.goal-line b{font-weight:600}
.goal-line b+.goal-line,.goal-line b{font-variant-numeric:tabular-nums}
.streak-flame{display:inline-flex;align-items:center;gap:2px;color:var(--amber)}
.streak-flame b{color:var(--amber)}
.today-note{display:flex;align-items:center;gap:4px;font-size:var(--fs-sm);color:var(--success);margin-top:8px}
.card.is-checked{border-color:var(--success)}
.card.is-overdue{box-shadow:var(--shadow-overdue)}
.plan-line{display:flex;align-items:flex-start;gap:4px;font-size:var(--fs-sm);color:var(--muted);margin-top:4px;line-height:1.5}
.plan-line svg{flex-shrink:0;margin-top:2px}

/* ===== 行内打卡表单 ===== */
.checkin{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.checkin .field{flex:1 1 96px;min-width:88px}
.checkin .field label{display:block;font-size:var(--fs-xs);color:var(--muted);margin-bottom:4px}
/* 固定标签颜色：里面的「5」超出了 0-1 范围，会按下拉框宽度抖动，给个固定 min-width 稳住 */
.checkin .field select option.range-warn{color:var(--muted)}
.checkin .field input,.checkin .field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--field-bg);color:var(--text)}
.checkin .field input:focus,.checkin .field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
/* 备注输入框：整行独占。多行文本挤在半行里根本写不下「第 12–35 页 / 重点看懂 agg 用法」，
   而这正是备注最常见的写法。字号同样必须 16px —— 理由与其它输入框一致：
   小于 16px 时 iOS Safari 聚焦会放大整页。resize:vertical 允许用户自己拉高，不改横向布局。 */
.checkin .field.note-field{flex:1 1 100%}
.checkin .field textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;font-family:inherit;line-height:1.55;background:var(--field-bg);color:var(--text);resize:vertical;min-height:52px}
.checkin .field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--focus-ring)}
.checkin-btn{flex:0 0 100%}
@media(min-width:560px){
  /* ⚠️ 这里原来是 flex-wrap:nowrap（把三个短字段和按钮挤在同一行）。
     加了备注框之后必须放开换行：nowrap 下 flex-basis:100% 的项**不会被换到新行**，
     而是被压回 .checkin .field 的 min-width —— 线上实测只有 88px 宽，
     也就是「整行独占」的规则写了、实际完全没生效，用户拿到的是一个写不下两行字的窄条。
     放开换行后桌面布局变成：第一行三个短字段，第二行 = 备注框 + 打卡按钮。 */
  .checkin{flex-wrap:wrap}
  /* 桌面下备注框与按钮同行（basis 200 + 按钮 auto 刚好放得下），
     不必强占 100% 再让按钮单独占一行。窄屏仍是上面那条 100%（整行独占）。 */
  .checkin .field.note-field{flex:1 1 200px}
  .checkin-btn{flex:0 0 auto;align-self:flex-end}
}

/* ===== 提醒卡动作区 ===== */
.alert-card{align-items:flex-start}
.alert-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
@media(max-width:480px){
  .alert-card{flex-direction:column;align-items:stretch}
  .alert-actions{flex-direction:row}
  .alert-actions .btn{flex:1}
}

/* ===== 卡片网格：桌面多栏 =====
   网格自己用 gap 控制间距，所以网格内的卡片不再各带 margin-bottom
   （否则「卡片间距 10px + margin 10px」会叠成 20px 的松散排布）。 */
.card-grid{display:grid;grid-template-columns:1fr;gap:10px}
.card-grid .card{margin-bottom:0}
@media(min-width:1025px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;align-items:start}}
@media(min-width:769px) and (max-width:1024px){.card-grid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;align-items:start}}

/* ===== A2 本周打卡节奏 ===== */
.rhythm{display:flex;gap:6px;padding:12px 16px 16px}
.rhythm-day{flex:1;text-align:center;padding:8px 2px;border-radius:var(--radius-sm);background:var(--surface-2);transition:background .2s,box-shadow .2s,opacity .2s}
.rhythm-day.hit{background:var(--primary-bg)}
.rhythm-day.today{box-shadow:0 0 0 1.5px var(--primary)}
.rhythm-day.future{opacity:.45}
.rhythm-day .rd{font-size:var(--fs-xs);color:var(--muted)}
.rhythm-day .rm{font-size:var(--fs-base);font-weight:600;line-height:1.4;color:var(--muted)}
.rhythm-day.hit .rm{color:var(--primary)}
.rhythm-day .rv{font-size:10px;color:var(--muted);min-height:14px;font-variant-numeric:tabular-nums}

/* ===== A1-1 近 35 天热力图 =====
   色阶全部走 --heat-* 令牌：浅色下是「白→深紫」，暗色下是「近底→亮紫」，
   两端都能看清「哪些天有记录」，这是热力图存在的唯一意义。 */
.heat-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 16px 4px;font-size:10px;color:var(--muted);text-align:center}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:0 16px 12px}
.heat-cell{aspect-ratio:1/1;border-radius:3px;background:var(--heat-0);min-height:0;transition:background .2s}
.heat-cell.blank{background:transparent}
.heat-cell.l1{background:var(--heat-1)}
.heat-cell.l2{background:var(--heat-2)}
.heat-cell.l3{background:var(--heat-3)}
.heat-cell.l4{background:var(--heat-4)}
.heat-cell.today{box-shadow:0 0 0 1.5px var(--primary)}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 16px 14px;font-size:var(--fs-xs);color:var(--muted)}
.heat-legend .heat-cell{width:12px;height:12px;aspect-ratio:auto;min-height:auto;flex-shrink:0}

/* ===== A1-2 最近动态 ===== */
.feed-row{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;border-top:1px solid var(--border)}
.feed-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.feed-main{flex:1;min-width:0;word-break:break-word}
.feed-main b{font-weight:600}
.feed-date{font-size:var(--fs-sm);color:var(--muted);flex-shrink:0}

/* ============================================================
   主题选择控件
   ------------------------------------------------------------
   两处入口，共用同一个状态：
   ① 顶栏圆形按钮 —— 循环切换（跟随系统 → 浅色 → 深色 → …），
      任何页面都能一键切换；
   ② 「我的」页三段选择器 —— 三项全平铺，明确知道当前处于哪种模式。
   两者都调用 setTheme()，状态存在 localStorage，刷新后保持。
   ============================================================ */
.theme-seg{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:var(--radius-sm);border:1px solid var(--border)}
.theme-seg button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid transparent;background:transparent;border-radius:var(--radius-sm);cursor:pointer;color:var(--muted);font-size:var(--fs-xs);transition:background .16s,color .16s;min-height:56px}
.theme-seg button[aria-pressed="true"]{background:var(--primary-bg);color:var(--primary);font-weight:600}
.theme-seg button:hover:not([aria-pressed="true"]){color:var(--text)}
/* 图标做一次轻微旋转切换，给「刚刚切了主题」一个即时反馈 */
.theme-btn svg{transition:transform .35s ease}
.theme-btn.spin svg{transform:rotate(180deg)}

/* ============================================================
   收尾层（必须留在样式表最后）
   ------------------------------------------------------------
   ⚠️ 这些规则与 `.btn` / `.btn-sm` 同权重，靠「后出现的赢」生效，
      所以要排在它们之后。写在上面会被基础规则反压回去（静默失效）。
   ============================================================ */
@media(max-width:768px){
  /* 移动端触控目标一律抬到 ≥44×44，手指点不空。
     ⚠️ 图标类按钮（.btn-icon/.theme-btn/.modal-close）基础规则里只有 32–36px，
        必须在这里显式抬起来；且这些选择器与上面的基础规则同权重，
        留在最后才会生效，写前面会被静默压回去。 */
  .btn,.btn-sm{min-height:44px}
  .btn-icon,.theme-btn,.modal-close{min-width:44px;min-height:44px}
  .modal-close{display:inline-flex;align-items:center;justify-content:center}
}

/* --- 目标卡（Homarr 式 widget）补充 --- */
/* 顶部色条：圆角要与卡片外圆角严丝合缝，否则两端会露出直角 */
.card-accent{border-radius:var(--radius) var(--radius) 0 0}
/* 卡片头部的编辑按钮：常态低调，卡片 hover 或键盘聚焦时才完全显形。
   移动端没有 hover，必须常驻全亮（否则手机上永远看不出这里能点）。 */
.goal-card .btn-icon{opacity:.7}
.goal-card:hover .btn-icon,.goal-card .btn-icon:focus-visible{opacity:1}
@media(hover:none){.goal-card .btn-icon{opacity:1}}

/* 分组标题里的文字块：图标 + 文案 + 徽标做成一整块，不被右侧细线挤散 */
.section-title span{display:inline-flex;align-items:center;gap:6px;min-width:0}

/* 工具条主操作按钮：不换行、不压缩，窄屏也点得到 */
.topbar-tools .btn{white-space:nowrap;flex-shrink:0}

/* ============================================================
   按钮动效层（同样必须留在样式表最后）
   ------------------------------------------------------------
   取自《前端按钮动效风格参考》（20 条），只挑了 5 条 + 1 处加强，
   挑选标准：① 触屏也吃得到（本工作台大量在手机上用，纯 hover 的效果等于不存在）；
             ② 不破坏 Homarr 式克制（小圆角 / 1px 描边 / 主色点缀 /
                **常态无阴影**），所以参考里的悬浮抬升、有机形变、3D 翻转、
                粒子爆发、液体填充这类展览型效果全部不要 ——
                参考里的 Shadow Lift 尤其不能用：它靠投影造层级，
                而本工作台刚把「层次交给描边、阴影只留给模态和 toast」定为规范。

   ⚠️ 下面全部用 currentColor + opacity 实现，**不新增任何颜色令牌** ——
      这样浅色 / 深色两套皮自动都是对的，不必再维护一组「动效专用色」。
   ⚠️ 这些规则与上面的 .btn 基础规则同权重，靠「后出现的赢」生效，所以要留在最后。
   ============================================================ */

/* —— 1 / Press Scale 按压缩放（参考 01-04）
      替换原来生硬的 transform:scale(.98)：换成弹簧曲线做
      「悬停轻抬 → 按下压扁 → 松开回弹」。这是全站按钮的基础触感，触屏也吃得到。 —— */
.btn,.btn-icon,.theme-btn,.modal-close{
  transition:transform var(--motion-press) var(--ease-spring),
             background-color var(--motion-quick) var(--ease-std),
             color var(--motion-quick) var(--ease-std),
             border-color var(--motion-quick) var(--ease-std),
             box-shadow var(--motion-quick) var(--ease-std);
  -webkit-tap-highlight-color:transparent;
}
/* ⚠️ 「悬停放大」这半条要用 (hover:hover) 兜住：触屏没有真 hover，
   手指点完按钮会「粘」在 :hover 上，那颗按钮会一直比旁边大一圈。
   （下面 Fill Sweep 的扫入同理，也必须包在这个查询里。） */
@media(hover:hover){
  .btn:hover,.btn-icon:hover,.theme-btn:hover,.modal-close:hover{transform:scale(1.03)}
}
.btn:active,.btn-icon:active,.theme-btn:active,.modal-close:active{transform:scale(.95)}

/* —— 2 / Ripple Click 涟漪点击（参考 02-01）
      只给「实色按钮」：这类按钮本身就是全站主操作（打卡 / 保存 / 新建），
      点下去立刻有一圈墨色扩散，写库那几百毫秒里不会觉得「点了没反应」。
      描边按钮走下面的 Fill Sweep，两者不叠加，免得花。 —— */
.ripple{
  position:absolute;z-index:1;border-radius:50%;pointer-events:none;
  background:currentColor;opacity:0;
  transform:translate(-50%,-50%) scale(0);
  animation:rippleOut var(--motion-long) var(--ease-std) forwards;
}
@keyframes rippleOut{
  0%{opacity:.20;transform:translate(-50%,-50%) scale(0)}
  70%{opacity:.10}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

/* —— 3 / Fill Sweep 颜色扫入（参考 01-01）
      描边按钮（次要操作）的悬停提示：底色从左往右扫进来，方向感明确。 —— */
.btn-outline::before{
  content:'';position:absolute;inset:0;z-index:0;
  background:currentColor;opacity:.10;
  transform:scaleX(0);transform-origin:left center;
  transition:transform var(--motion-quick) var(--ease-std);
}
@media(hover:hover){
  .btn-outline:hover::before{transform:scaleX(1)}
}

/* —— 4 / Loading Morph 加载形变 · 简化版（参考 03-01）
      写库期间把按钮内容换成环形 spinner。**这一条不只是好看**：
      doCheckin 原先只 disable 了输入框、没锁按钮，网络慢时连点两下
      会写进两条重复打卡。加了 .is-busy 后按钮 pointer-events:none，重复提交被堵死。
      ⚠️ 刻意不做参考里「收缩成圆」的宽度形变：`.checkin-btn` 在窄屏是
         flex-basis:100%，拿 width 做形变会被 flex 压回来，反而跳一下。
         所以尺寸不动、只换内容 —— 两种屏幕都不会抖。 —— */
.btn.is-busy{pointer-events:none;cursor:default}
.btn.is-busy::after{
  content:'';position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;
  border-radius:50%;border:2px solid transparent;
  animation:sgtSpin var(--motion-long) linear infinite;
}
@keyframes sgtSpin{to{transform:rotate(360deg)}}
/* color:transparent 一次把文字和 SVG 图标都藏掉（本项目图标全用 currentColor 描边），
   比逐个 opacity 稳 —— 按钮里的文字是**裸文本节点**，选择器根本选不到它。 */
.btn-primary.is-busy,.btn-success.is-busy,.btn-danger.is-busy,.btn-amber.is-busy,.btn-outline.is-busy{color:transparent}
.btn-primary.is-busy::after{border-color:var(--on-primary);border-top-color:transparent}
.btn-success.is-busy::after,.btn-danger.is-busy::after,.btn-amber.is-busy::after{border-color:var(--on-solid);border-top-color:transparent}
.btn-outline.is-busy::after{border-color:var(--primary);border-top-color:transparent}

/* —— 5 / Success Pop 成功回弹（参考 03-02 的按钮版）
      打卡写成功后，那颗按钮弹一下 —— 彩带是页面级庆祝，
      这个是「你刚点的那颗按钮，事成了」的局部确认，两者互补。
      ⚠️ 只在那一次渲染播放：门禁（S._popId）由 doCheckin 给、renderGoalCard
         消费一次即清。若写成「只要是绿色按钮就播」，每次刷新重渲染都会重播，
         会变成一颗一直在闪的按钮 —— 破坏性最小的错法，但很难查。 —— */
.checkin-btn.is-success{animation:successPop var(--motion-morph) var(--ease-spring)}
@keyframes successPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.06)}
  70%{transform:scale(.97)}
  100%{transform:scale(1)}
}

/* —— 6 / 键盘聚焦环加强（从参考 02-02 光晕里只取静态版）
      工作台是长时间停留的界面，参考里 800ms 的无限呼吸光晕会一直抢注意力，
      所以不做循环动画，只把聚焦环描清楚。 —— */
.btn:focus-visible,.btn-icon:focus-visible,.theme-btn:focus-visible,.modal-close:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;
}
</style>
<script>
/* ============================================================
   主题引导（必须同步、且必须在 <body> 之前执行）
   ------------------------------------------------------------
   为什么不能等 DOMContentLoaded：那样浏览器会先按浅色把首屏画出来，
   再跳到深色，用户看到明显的白屏闪烁（FOUC）。
   这里在解析到 head 时就定下 <html data-theme>，首帧即为正确主题。
   ============================================================ */
(function(){
  var KEY='sgt_theme_v1';
  var MIGRATED='sgt_theme_default_dark_v1';
  var mode=null;
  try{mode=localStorage.getItem(KEY)}catch(e){}
  if(mode!=='light'&&mode!=='dark'&&mode!=='auto')mode=null;

  /* 默认值由「跟随系统」改为「深色」（对齐 Homarr 那套深色仪表盘观感）。
     ⚠️ 这里必须是一次性迁移，用一个独立的迁移标记做门禁，不能每次打开都按默认值纠正：
        否则用户主动选了「跟随系统」之后，下次进来又被重置成深色，那个选项等于失效
        （本页踩过的「静默失效」类问题，不能再犯一次）。
     迁移规则：从未主动钉死过主题（存的是 auto 或压根没存过）→ 落到新默认「深色」；
              已经明确选过 light / dark 的，原样保留。 */
  var migrated=false;
  try{migrated=localStorage.getItem(MIGRATED)==='1'}catch(e){}
  if(!migrated){
    if(mode!=='light'&&mode!=='dark')mode='dark';
    try{localStorage.setItem(KEY,mode);localStorage.setItem(MIGRATED,'1')}catch(e){}
  }
  /* localStorage 不可读（隐私模式）时的兜底 */
  if(mode!=='light'&&mode!=='dark'&&mode!=='auto')mode='dark';
  var eff=mode;
  if(mode==='auto'){
    eff=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  }
  var root=document.documentElement;
  root.setAttribute('data-theme',eff);
  root.setAttribute('data-theme-mode',mode);
  /* 供主脚本读取，避免它再去判断一次（也避免第二次读 localStorage 抛错） */
  window.__sgtTheme={key:KEY,mode:mode,eff:eff};
})();
</script>
</head>
<body>
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="app-header">
      <!-- 品牌标记：2×2 圆角方块，用品牌色令牌着色 —— 取代原来的单色线框图标，
           顺带把「这是一个仪表盘」的信号给出来。 -->
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="1" y="1" width="10" height="10" rx="2.5" fill="var(--primary)"/>
        <rect x="13" y="1" width="10" height="10" rx="2.5" fill="var(--primary-l)"/>
        <rect x="1" y="13" width="10" height="10" rx="2.5" fill="var(--primary-l)"/>
        <rect x="13" y="13" width="10" height="10" rx="2.5" fill="var(--primary)"/>
      </svg>
      <span class="brand-name">学习目标管理台</span>
      <!-- 同步状态 + 主题切换：窄屏就在这一行；桌面端整套搬到内容区的吸顶工具条上。
           两处是独立 DOM，共用 js-* 类名，JS 同时更新两处，
           不会出现「只有一处被更新」的半死状态。 -->
      <div class="header-tools">
        <span class="sync-badge syncing js-sync-badge"></span>
        <button class="theme-btn js-theme-btn" type="button" onclick="cycleTheme()" aria-label="切换主题" title="切换主题"></button>
      </div>
    </div>
    <nav class="nav" id="nav" role="tablist" aria-label="主导航">
      <button class="nav-item active" data-tab="today" role="tab" id="tabbtn-today" aria-selected="true" aria-controls="tab-today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
        <span>今日打卡</span>
      </button>
      <button class="nav-item" data-tab="dashboard" role="tab" id="tabbtn-dashboard" aria-selected="false" aria-controls="tab-dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/></svg>
        <span>进度看板</span>
      </button>
      <button class="nav-item" data-tab="weekly" role="tab" id="tabbtn-weekly" aria-selected="false" aria-controls="tab-weekly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/></svg>
        <span>周报复盘</span>
      </button>
      <button class="nav-item" data-tab="mine" role="tab" id="tabbtn-mine" aria-selected="false" aria-controls="tab-mine">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>我的</span>
      </button>
    </nav>
    <!-- 侧栏底部（仅桌面可见）：窄屏有底部 Tab，不需要这一块 -->
    <div class="sidebar-foot">
      <button class="btn btn-outline btn-sm btn-block" type="button" onclick="manualSync()">重新同步</button>
      <div class="sidebar-note">数据保存在线上资料库，多设备自动同步。</div>
    </div>
  </div>
  <main class="content" id="content">
    <!-- 吸顶工具条（Homarr 式内容区头部）：当前模块 + 同步状态 + 主题 + 主操作。
         标题与主操作按钮随 Tab 切换由 updateTopbar() 更新，DOM 本身是静态的，
         不会被各 Tab 的 innerHTML 覆盖掉。 -->
    <header class="topbar">
      <div class="topbar-title">
        <span id="topbar-icon" aria-hidden="true"></span>
        <h1 id="topbar-title">今日打卡</h1>

      <div class="topbar-tools">
        <span class="sync-badge syncing js-sync-badge" role="status" aria-live="polite"></span>
        <button class="theme-btn js-theme-btn" type="button" onclick="cycleTheme()" aria-label="切换主题" title="切换主题"></button>
        <button class="btn btn-primary btn-sm" id="topbar-action" type="button">新建目标</button>

    <div id="tab-dashboard" class="tab-panel" role="tabpanel" aria-labelledby="tabbtn-dashboard"></div>
    <div id="tab-weekly" class="tab-panel" role="tabpanel" aria-labelledby="tabbtn-weekly"></div>

  <div class="modal-content" id="modal-content"></div>

<script>
(function(){
'use strict';

/* ====== Constants ====== */
var DATABASE_ID='OereifjY46k3XWmQX6KVfK';

/* 目标配色表。
   ⚠️ 这里存的是 CSS 变量引用（var(--gc-xxx)）而不是十六进制色值。
   原因：颜色若写死在 JS 里，切换主题就必须重新渲染整页才能换色；
   交给 CSS 令牌后，切主题只是 <html data-theme> 变一次，所有目标卡即时变色。
   令牌本体在上方样式表的 :root 与 [data-theme="dark"] 里，两处都要有；
   末尾带兜底值，万一某个令牌漏定义也会退回品牌色，而不是变成透明。 */
var COLOR_KEYS=['purple','blue','green','orange','pink','teal'];
var COLORS={};
COLOR_KEYS.forEach(function(k){
  COLORS[k]={
    p:'var(--gc-'+k+',var(--primary))',      /* 色块用：色点 / 进度条 / 左侧色条 / 图表柱 */
    ink:'var(--gci-'+k+',var(--primary))',   /* 文字用：完成量 / 剩余量 / 建议量 / 完成率 */
    l:'var(--gcl-'+k+',var(--primary-l))',
    bg:'var(--gcbg-'+k+',var(--primary-bg))'
  };
});

/* ====== 主题：浅色 / 深色 / 跟随系统 ======
   设计要点：
   · 「选择值」与「实际值」分开。用户选 auto 时，实际显示由系统偏好决定；
     这两个值必须能分别读到，否则顶栏按钮无法说清「现在是跟随系统」还是「钉死了深色」。
   · 主题只作用于 <html data-theme>，颜色全部由 CSS 令牌派生，
     所以切换不需要重新渲染任何内容，也不会打断用户正在填的表单。
   · 首屏由 head 里的同步脚本先定好，这里只负责后续切换与控件状态同步。 */
var THEME_KEY='sgt_theme_v1';
/* 这个数组的顺序就是「点顶栏按钮时的轮换顺序」，把默认的深色放在首位：
   深色 → 浅色 → 跟随系统 → 深色… */
var THEME_MODES=['dark','light','auto'];
var THEME_ICON={light:'sun',dark:'moon',auto:'auto'};
var THEME_NAME={light:'浅色',dark:'深色',auto:'跟随系统'};
var _themeMode=(window.__sgtTheme&&window.__sgtTheme.mode)||null;
var _mql=(window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null);

function themeMode(){
  if(_themeMode)return _themeMode;
  var m=null;
  try{m=localStorage.getItem(THEME_KEY)}catch(e){}
  /* 兜底默认值同样是「深色」，与 head 里的引导脚本保持一致：
     两处若不一致，会出现「首帧深色、脚本接管后跳浅色」的闪跳。 */
  if(m!=='light'&&m!=='dark'&&m!=='auto')m='dark';
  _themeMode=m;
  return m;
}
/* 选择值 → 实际生效值 */
function themeEffective(){
  var m=themeMode();
  if(m==='auto')return(_mql&&_mql.matches)?'dark':'light';
  return m;
}
/* 唯一的主题应用入口：改属性、存偏好、同步两个控件的显示。
   传 mode 表示「用户做了选择」，不传表示「按当前选择重算一遍」。 */
function applyTheme(mode){
  if(mode!==undefined){
    if(THEME_MODES.indexOf(mode)<0)return themeEffective();
    _themeMode=mode;
    try{localStorage.setItem(THEME_KEY,mode)}catch(e){}
  }
  var m=themeMode(),eff=themeEffective();
  var root=document.documentElement;
  root.setAttribute('data-theme',eff);
  root.setAttribute('data-theme-mode',m);
  /* 移动端地址栏配色：取顶栏渐变的起始色。页面最顶端就是顶栏，
     这样地址栏与页面在视觉上是连成一片的。色值从令牌里读，
     不在这里写死十六进制，否则改样式时这里会悄悄脱钩。 */
  var meta=document.getElementById('theme-color');
  if(meta){

/* ====== 只读模式 / 未登录暂存 ======
   平台权限模型：匿名可 query，写操作（addRecord / updateRecord / deleteRecord）返回 401 not login。
   未登录点提交时平台会跳登录并整页重载，内存里的输入会全部丢失，所以先把用户填的内容
   落到 localStorage，登录回来后自动填回，用户不用重填一遍。 */
function markReadonly(err){

  if(m.indexOf('401')>=0||m.indexOf('not login')>=0||m.toLowerCase().indexOf('login')>=0){S.readonly=true;return true}

    var o=JSON.parse(raw);
    if(!o||!o.t||Date.now()-o.t>86400000){localStorage.removeItem(LEFT_KEY);return null}
    if(o.date&&o.date!==todayKey()){localStorage.removeItem(LEFT_KEY);return null}

/* ====== Date Utils ====== */
function dkey(d){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd}
function todayKey(){return dkey(new Date())}
/* 库里 date 字段读回来是 ISO UTC（"2026-12-31T00:00:00Z"），直接 new Date() 在东八区
   会得到当天 08:00 —— 一旦落在午夜边缘就会整体偏移一天。所以先截出日期部分按本地时间造 Date。
   注意不能只判断「以 Z 结尾」：不带 Z 的裸 ISO（"2026-12-31T00:00:00"）在多数引擎里也按 UTC 解析，
   同样会偏。判据取「有 T 就取日期段」，最稳。
   ⚠️ 空值绝不能再回退成 new Date()：那会把「字段没存上」伪装成「截止日是今天」，
   连带 getRemainingDays 算出 0 → 建议量变成「剩余全部一次完成」，且完全不报错。
   现在返回 Invalid Date，由调用方用 isInvalid() 兜住。 */
function parseDate(s){
  if(s instanceof Date)return s;
  if(s===null||s===undefined||s==='')return new Date(NaN);
  var str=String(s).trim();
  if(!str)return new Date(NaN);
  if(str.indexOf('T')>=0)str=str.split('T')[0];        /* "2026-12-31T00:00:00Z" → "2026-12-31" */
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(str);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);           /* 按本地时间造，不涉时区转换 */
  var d=new Date(str);
  return d;
}
function isInvalid(d){return !d||isNaN(d.getTime())}
/* 用户没填 / 字段没存上时的兜底标记，界面据此显示「未设置」而不是编一个日期 */
function hasDeadline(g){return !isInvalid(parseDate(g&&g['截止日期']))}
function daysBetween(d1,d2){return Math.round((d2-d1)/(86400000))}
function addDays(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function weekStart(d){var r=new Date(d);r.setHours(0,0,0,0);var day=r.getDay()||7;r.setDate(r.getDate()-day+1);return r}
function fmtDate(s){var d=parseDate(s);if(isInvalid(d))return'未设置';return(d.getMonth()+1)+'月'+d.getDate()+'日'}
function fmtDateShort(s){var d=parseDate(s);if(isInvalid(d))return'未设置';return d.getMonth()+1+'/'+d.getDate()}
/* 兜一层：d 无效时别返回 undefined（会被拼成「周undefined」这种脏文案） */
function weekDay(d){if(isInvalid(d))return'';return['日','一','二','三','四','五','六'][d.getDay()]}
/* 月份首日的第 3 个字符会落进该月首格，所以下划线前要补一个全角空格占位 */
function fmtMonthNum(d){var m=d.getMonth()+1;return(m>=10?String(m):'\u3000'+m)+'\u200a月'}

/* 文本转义：所有来自数据库的字符串在拼进 innerHTML 前必须过这里 */
function esc(s){
  if(s===null||s===undefined)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* 属性值转义（用于 value="..." 场景，和 esc 同源但语义独立） */
function escAttr(s){return esc(s)}
/* 取首字做目标头像。用 Array.from 而不是 s.charAt(0)：
   目标名若是 emoji 或生僻字（代理对），charAt 会取到半个字符，渲染出乱码方块。 */
function firstChar(s){
  var t=String(s===null||s===undefined?'':s).trim();
  if(!t)return '#';
  var arr=Array.from(t);
  return arr.length?arr[0]:'#';
}

var _isLoading=false;

function loadAll(){
  if(_isLoading)return;

  if(!initDB()){
    _isLoading=false;
    if(_dbRetryCount<20){_dbRetryCount++;S.sync='loading';updateSyncBadge();renderAll();setTimeout(loadAll,500);return}
    S.sync='offline';updateSyncBadge();renderAll();return
  }
  _dbRetryCount=0;
  db.getSchema({databaseId:DATABASE_ID}).then(function(schema){
    (schema.properties||[]).forEach(function(f){
      if(f.type==='select'&&f.config&&f.config.options)S.schemaOpts[f.name]=f.config.options;
    });
    return Promise.all([
      db.query({databaseId:DATABASE_ID,pageSize:500}),
      db.query({databaseId:'DRuD6oQI5lrK5IhZQS1fzn',pageSize:500}),
      db.query({databaseId:'kVj8GOSzCqSOUhes5vYBhg',pageSize:500})

  }).then(function(res){

    S.goals.sort(function(a,b){return parseDate(b['创建日期'])-parseDate(a['创建日期'])});
    S.checkins.sort(function(a,b){return parseDate(b['日期'])-parseDate(a['日期'])});
    S.weeklies.sort(function(a,b){return parseDate(b['周开始日期'])-parseDate(a['周开始日期'])});
    /* 数据整体换了一茬，孤儿索引必须作废重算 —— 否则会拿上一轮的索引去判新数据，
       表现为「刚删的目标其记录还没被排除」或反过来把有效记录当孤儿。 */
    S._orphanIdx=null;S._orphanIdxFor=null;
