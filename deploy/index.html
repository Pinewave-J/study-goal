/* ====== Calculations ====== */
/* 数值格式化：去掉浮点噪声，整数不显示 .0 */
function trimNum(n){
  if(n===null||n===undefined||isNaN(n))return'0';
  var r=Math.round(Number(n)*10)/10;
  return (Math.abs(r-Math.round(r))<1e-9)?String(Math.round(r)):r.toFixed(1);
}
/* 单位与「分钟数」的换算提示。
   ⚠️ 为什么需要它：目标单位如果是「小时」，用户填「本次完成 1 小时 + 用时 60 分钟」时，
      界面并排渲染成「+1 小时 60分」，看起来像同一件事说了两遍、甚至像「60 分钟没被识别」。
      其实两个字段各自都对（数量=1小时，用时=60分钟），只是**单位不同却并排显示**，
      读者会下意识把它们当成同一量纲去对账。
      所以：当目标单位本身是时间单位时，在分钟后面补一个「= X 小时」的换算，
      让「60分」和「1 小时」的关系一眼可见，不再像矛盾数据。 */
function minUnitHint(unit,mins){
  if(!mins||mins<=0)return'';
  var u=String(unit||'').trim();
  if(u!=='小时'&&u!=='h'&&u!=='H'&&u!=='时')return'';
  var h=mins/60;
  return ' (= '+trimNum(h)+' 小时)';
}

function goalCheckins(gid){
  /* 容错：允许传入目标对象，内部统一取 record_id，避免调用方传错形态导致静默返回空数组 */
  if(gid&&typeof gid==='object')gid=gid._id;
  return S.checkins.filter(function(c){return c['目标ID']===gid});
}
/* 找出「目标已经不在了」的打卡记录：目标ID 为空，或指向一个已删除的目标。
   典型来源：示例目标被删除后，它的打卡记录仍留在表里；
            或目标ID 字段写空（字段类型不匹配时的静默丢弃）。
   这类记录不属于任何现存目标，界面上没有入口能看到它，
   但会混进按日期统计的数字里（周报投入量、打卡天数等），让数对不上。
   ⚠️ 定义放在这里而不是 clearExamples 旁边：loadAll 之后就要用它做自检，
      函数声明提升能保证「先调用后定义」也正常，但放前面可读性更好。 */
function findOrphanCheckins(){
  var alive={};
  S.goals.forEach(function(g){if(g&&g._id)alive[g._id]=true});
  return S.checkins.filter(function(r){return !r['目标ID']||!alive[r['目标ID']]});
}
/* 单条判定版。findOrphanCheckins 是每次过滤都重建索引（O(n) 建表 + O(m) 扫），
   在逐日循环里（周报 7 天 × 每天扫全表）反复调用太亏，这里单独给一条快捷判断。
   索引缓存在 S 上，loadAll 换数据时清掉（见 loadAll 里的 _orphanIdx 复位）。 */
function orphanIndex(){
  if(S._orphanIdx&&S._orphanIdxFor===S.goals)return S._orphanIdx;
  var alive={};
  S.goals.forEach(function(g){if(g&&g._id)alive[g._id]=true});
  var idx={};
  S.checkins.forEach(function(r){if(!r['目标ID']||!alive[r['目标ID']])idx[r._id]=true});
  S._orphanIdx=idx;S._orphanIdxFor=S.goals;
  return idx;
}
function isOrphanCheckin(c){return !!c&&!!orphanIndex()[c._id]}
function goalTotal(gid){var t=0;goalCheckins(gid).forEach(function(c){t+=(c['数量']||0)});return t}
function goalTodayTotal(gid){
  var tk=todayKey();var t=0;
  goalCheckins(gid).forEach(function(c){if(dkey(parseDate(c['日期']))===tk)t+=(c['数量']||0)});
  return t;
}
function getRemaining(g){return Math.max(0,(g['总量']||0)-goalTotal(g._id))}
/* 没设截止日（或字段没存上）时返回 null，而不是 0 —— 0 会被下游当成「就是今天到期」，
   直接把建议量撑成「剩余全部一次完成」。调用方必须显式处理 null。 */
function getRemainingDays(g){
  var dl=parseDate(g['截止日期']);
  if(isInvalid(dl))return null;
  dl.setHours(0,0,0,0);
  var today=new Date();today.setHours(0,0,0,0);
  return daysBetween(today,dl);
}
/* B1：建议量 = 剩余 ÷ (剩余天数+1)，含今天；保留 1 位小数。
   无截止日 → 返回 0（不编节奏，卡片改展示「剩余」、输入框留空由用户自己填）；
   已逾期 → 一次补完。 */
function getTodaySuggested(g){
  var rem=getRemaining(g);
  if(rem<=0)return 0;
  var daysLeft=getRemainingDays(g);
  if(daysLeft===null)return 0;              /* 没截止日：不切分 */
  if(daysLeft<0)return rem;                 /* 已逾期：建议一次补完 */
  return Math.ceil(rem/Math.max(1,daysLeft+1)*10)/10;
}
function getCompletionRate(g){
  var t=g['总量']||0;if(!t)return 0;
  return Math.min(100,Math.round(goalTotal(g._id)/t*100));
}

/* 某目标在指定日期集合中的「是否休息日」：不早于目标创建日 */
function isRestDayG(gid,dateObj,dates){
  var g=goalById(gid);if(!g)return false;
  var mon=weekStart(dateObj);
  var created=parseDate(g['创建日期']);
  /* 创建日读不出来（老数据/字段没存上）时，不要用 Invalid Date 去比大小 —— 那会让
     start 恒等于 mon，把「目标还不存在的那几天」也算进休息日判定，凭空多出休息日。
     退回一个极早日期，等价于不限下界，行为与修复前一致且不产生假休息日。 */
  if(isInvalid(created))return false;
  created.setHours(0,0,0,0);
  var start=mon<created?created:mon;
  var cur=new Date(start);
  while(cur<dateObj){
    if(!dates[dkey(cur)])return false;
    cur=addDays(cur,1);
  }
  return true;
}
/* B3：以创建日为下界，去掉 365 硬编码 */
function calculateStreak(gid){
  var g=goalById(gid);if(!g)return 0;
  var dates={};goalCheckins(gid).forEach(function(c){dates[dkey(parseDate(c['日期']))]=true});
  var created=parseDate(g['创建日期']);
  var cur=new Date();cur.setHours(0,0,0,0);
  if(!dates[dkey(cur)])cur=addDays(cur,-1);      /* 今天还没打卡不视为断 */
  var streak=0;
  if(isInvalid(created)){
    /* 无创建日下界：只往回数连续段，最多看 365 天，避免死循环 */
    var guard=0;
    while(guard++<365){
      if(dates[dkey(cur)]){streak++;cur=addDays(cur,-1);continue}
      if(isRestDayG(gid,cur,dates)){cur=addDays(cur,-1);continue}
      break;
    }
    return streak;
  }
  created.setHours(0,0,0,0);
  while(cur>=created){
    if(dates[dkey(cur)]){streak++;cur=addDays(cur,-1);continue}
    if(isRestDayG(gid,cur,dates)){cur=addDays(cur,-1);continue}
    break;
  }
  return streak;
}

function getYesterdayStatus(gid){
  var y=addDays(new Date(),-1);y.setHours(0,0,0,0);
  var yk=dkey(y);
  var has=goalCheckins(gid).some(function(c){return dkey(parseDate(c['日期']))===yk});
  if(has)return'checked';
  var dates={};goalCheckins(gid).forEach(function(c){dates[dkey(parseDate(c['日期']))]=true});
  return isRestDayG(gid,y,dates)?'rest':'broken';
}

/* 昨日是否漏打卡（未完成、今天未打卡、且创建日早于昨天） */
function missedYesterday(g){
  if(isGoalComplete(g))return false;
  if(hasCheckinOn(g._id,todayKey()))return false;
  var g_created=parseDate(g['创建日期']);
  var y=addDays(new Date(),-1);y.setHours(0,0,0,0);
  /* 创建日缺失时不拦（宁可提示一次，也别把该提醒的目标藏起来） */
  if(!isInvalid(g_created)){g_created.setHours(0,0,0,0);if(g_created>y)return false}
  return !hasCheckinOn(g._id,dkey(y));
}
function hasCheckinOn(gid,dk){
  return goalCheckins(gid).some(function(c){return dkey(parseDate(c['日期']))===dk});
}
function goalById(gid){
  for(var i=0;i<S.goals.length;i++){if(S.goals[i]._id===gid)return S.goals[i]}
  return null;
}
function isGoalComplete(g){return getRemaining(g)<=0}

/* B4：预计完成日 —— 近 7 天均值推算，样本不足 3 天不出数字 */
function getEstimatedCompletionDetail(g){
  var today=new Date();today.setHours(0,0,0,0);
  var start=addDays(today,-6);
  var records=goalCheckins(g._id).filter(function(c){
    var d=parseDate(c['日期']);d.setHours(0,0,0,0);
    return d>=start&&d<=today;
  });
  var uniq={};records.forEach(function(c){uniq[dkey(parseDate(c['日期']))]=true});
  var dayCount=Object.keys(uniq).length;
  if(dayCount<3)return{status:'sample',days:dayCount};
  var total=0;records.forEach(function(c){total+=(c['数量']||0)});
  var speed=total/7;
  if(speed<=0)return{status:'sample',days:dayCount};
  var rem=getRemaining(g);
  if(rem<=0)return{status:'completed'};
  var need=Math.ceil(rem/speed);
  var etaDate=addDays(today,need);
  var dl=parseDate(g['截止日期']);
  if(isInvalid(dl))return{status:'ok',date:etaDate,diff:null};   /* 无截止日：只给预计日，不比早晚 */
  dl.setHours(0,0,0,0);
  return{status:'ok',date:etaDate,diff:daysBetween(etaDate,dl)};
}
function getEstimatedCompletion(g){
  var r=getEstimatedCompletionDetail(g);
  if(r.status==='completed')return'completed';
  if(r.status==='ok')return r.date;
  return null;
}

function isOverdue(g){
  var dl=parseDate(g['截止日期']);
  if(isInvalid(dl))return false;              /* 没截止日就谈不上逾期 */
  dl.setHours(23,59,59,999);
  var today=new Date();today.setHours(0,0,0,0);
  return today>dl&&getRemaining(g)>0;
}
function overdueDays(g){
  var dl=parseDate(g['截止日期']);
  if(isInvalid(dl))return 0;
  dl.setHours(0,0,0,0);
  var today=new Date();today.setHours(0,0,0,0);
  return Math.abs(daysBetween(dl,today));
}
/* 近 N 天分钟数合计（全局或指定目标）
   ⚠️ gid 为空 = 全局统计，这里必须排除孤儿记录（所属目标已被删除的打卡）。
      否则「本周打卡节奏」的分钟数会混进早就删掉的目标，天数格子亮着、点进目标却没有，
      数字对不上还查不出原因。传了 gid 时天然只命中该目标，不受影响。 */
function minutesOn(gid,dk){
  var s=0;
  S.checkins.forEach(function(c){
    if(gid&&c['目标ID']!==gid)return;
    if(!gid&&isOrphanCheckin(c))return;
    if(dkey(parseDate(c['日期']))===dk)s+=(c['分钟数']||0);
  });
  return s;
}
/* 近 N 天「打卡笔数」（全局或指定目标），排除孤儿。
   ⚠️ 为什么需要这个：「分钟数」是选填字段，用户完全可以只填数量不填分钟。
      而本周节奏格 / 热力图原来**只看分钟数**，于是会出现
      「今天明明打了卡（数量 24 页），但节奏格不亮、本周已投入 0 分钟」这种自相矛盾的显示。
      打卡这件事本身是发生了的，格子就该亮 —— 分钟数只是「额外信息」而非「是否打卡」的判据。 */
function checkinCountOn(gid,dk){
  var n=0;
  S.checkins.forEach(function(c){
    if(gid&&c['目标ID']!==gid)return;
    if(!gid&&isOrphanCheckin(c))return;
    if(dkey(parseDate(c['日期']))===dk)n++;
  });
  return n;
}
/* 近 N 天「总投入量」，排除孤儿。用于在没填分钟时也能显示「今天做了多少」 */
function amountOn(gid,dk){
  var s=0;
  S.checkins.forEach(function(c){
    if(gid&&c['目标ID']!==gid)return;
    if(!gid&&isOrphanCheckin(c))return;
    if(dkey(parseDate(c['日期']))===dk)s+=(c['数量']||0);
  });
  return s;
}
function last7Sum(gid){
  var t=todayKey(),from=dkey(addDays(new Date(),-6)),s=0;
  S.checkins.forEach(function(c){
    if(c['目标ID']!==gid)return;
    var d=dkey(parseDate(c['日期']));
    if(d>=from&&d<=t)s+=(c['数量']||0);
  });
  return s;
}

/* ====== Rendering ====== */
/* 统一刷新入口（铁律：渲染函数之间不得互相调用）。
   applyTheme 放在最后：它要同步「我的」页里那段主题选择器的选中态，
   而那段 DOM 是 renderMine() 刚重建出来的 —— 顺序反了就同步不到。 */
function renderAll(){renderToday();renderDashboard();renderWeekly();renderMine();applyTheme()}

function renderToday(){
  var el=document.getElementById('tab-today');
  if(S.sync==='loading'){el.innerHTML='<div class="skeleton-h"></div><div class="skeleton-h" style="width:60%"></div><div class="skeleton-h" style="width:80%"></div><div class="skeleton-h"></div>';return}
  if(S.sync==='offline'&&!S.goals.length){el.innerHTML='<div class="empty">'+ic('alert',40)+'<p>数据加载失败</p><button class="btn btn-primary" onclick="loadAll()" style="margin-top:12px">重新同步</button></div>';return}

  var t=todayKey();
  var html='';

  /* 离线告警条：读取失败或写入受限时给出明确出口，不静默 */
  if(S.sync==='offline'){
    html+='<div class="alert-card red" style="margin-bottom:12px"><div class="alert-text"><strong>未连接到线上数据</strong><span style="display:block;font-size:12px;color:var(--muted)">打卡和新建会失败。若是首次打开，请稍候或点右侧重试。</span></div><div class="alert-actions"><button class="btn btn-danger btn-sm" onclick="manualSync()">重试</button></div></div>';
  } else if(S.readonly){
    html+=needLoginNoticeHtml();
  } else if(S.sync==='synced'&&S.lastSync){
    var mm=String(S.lastSync.getHours()).padStart(2,'0')+':'+String(S.lastSync.getMinutes()).padStart(2,'0');
    html+='<div class="tiny" style="padding:0 0 10px">'+ic('check',12)+' 已连接线上资料库 · 最近同步 '+mm+'</div>';
  }

  html+='<button class="btn btn-primary btn-block" style="margin-bottom:16px" onclick="openNewGoal()">'+ic('plus',18)+' 新建目标</button>';

  /* ===== 今天要处理：逾期 / 昨日漏卡（区分休息日） ===== */
  var realMissed=[],restGoals=[];
  S.goals.forEach(function(g){
    if(g['状态']==='已完成'||g['状态']==='已归档')return;
    if(!missedYesterday(g))return;
    var y=addDays(new Date(),-1);y.setHours(0,0,0,0);
    var dates={};goalCheckins(g._id).forEach(function(c){dates[dkey(parseDate(c['日期']))]=true});
    if(isRestDayG(g._id,y,dates))restGoals.push(g);else realMissed.push(g);
  });

  if(realMissed.length||restGoals.length){
    html+='<section class="gs-section"><div class="section-title"><span>'+ic('flag',16)+' 今天要处理</span></div>';
    realMissed.forEach(function(g){
      var od=isOverdue(g);
      var why=od?('已逾期 '+overdueDays(g)+' 天，且昨天没学'):'昨天没学 · 已滚入今日';
      html+='<div class="alert-card red"><div class="alert-text" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK"><strong>'+esc(g['目标名称'])+'</strong><span style="display:block;font-size:12px;color:var(--muted)">'+why+'</span>'+planLineHtml(g)+'</div>';
      html+='<div class="alert-actions"><button class="btn btn-danger btn-sm" onclick="openCheckin(\''+g._id+'\')">立即打卡</button>';
      if(od)html+='<button class="btn btn-outline btn-sm" onclick="openEditGoal(\''+g._id+'\')">调整计划</button>';
      html+='</div></div>';
    });
    restGoals.forEach(function(g){
      html+='<div class="alert-card yellow"><div class="alert-text" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK"><strong>'+esc(g['目标名称'])+'</strong><span style="display:block;font-size:12px;color:var(--muted)">昨天漏打卡 · 已用本周休息日（每周 1 天），连续天数保住了</span>'+planLineHtml(g)+'</div>';
      html+='<div class="alert-actions"><button class="btn btn-amber btn-sm" onclick="openCheckin(\''+g._id+'\')">立即打卡</button></div></div>';
    });
    html+='</section>';
  }

  /* ===== 待打卡 / 已打卡 分区 ===== */
  var activeGoals=S.goals.filter(function(g){return g['状态']!=='已完成'&&g['状态']!=='已归档'&&!isGoalComplete(g)});
  var pendHtml='',doneHtml='',doneCnt=0;
  if(S.goals.length===0){
    pendHtml='<div class="empty"><p>还没有目标，点击上方按钮创建</p></div>';
  }else if(activeGoals.length===0){
    pendHtml='<div class="empty"><p>所有目标都已达成，去「进度看板」回顾成果，或新建目标继续。</p></div>';
  }else{
    activeGoals.forEach(function(g){
      var row=renderGoalCard(g);
      if(hasCheckinOn(g._id,t)){doneHtml+=row;doneCnt++}else pendHtml+=row;
    });
  }

  /* 分组容器：标题 + 网格。原来 pendHtml 是裸卡片流，靠卡片自带的 margin 撑间距；
     现在统一交给 .card-grid 的 gap 管，网格内卡片不再各带 margin（见样式表）。 */
  html+='<section class="gs-section"><div class="section-title"><span>'+ic('list',16)+' 待打卡目标</span></div><div class="card-grid">'+pendHtml+'</div></section>';

  if(doneCnt>0){
    html+='<section class="gs-section"><div class="section-title"><span>'+ic('check',16)+' 今日已打卡<span class="sec-badge">'+doneCnt+'</span></span></div>';
    html+='<div class="card-grid">'+doneHtml+'</div></section>';
  }

  /* ===== A2 本周打卡节奏 ===== */
  html+='<section class="gs-section">'+renderWeekRhythm()+'</section>';
  html+='<div style="margin-top:16px"><button class="btn btn-outline btn-block" onclick="openNewGoal()">'+ic('plus',18)+' 新建学习目标</button></div>';
  el.innerHTML=html;
  restoreLeftoverToForms();
}

/* 登录回来后，把跳登录前暂存的内容填回对应目标的输入框，用户不用重填一遍。
   只在「首次拿到数据的那次渲染」执行（见 loadAll 成功分支）：
   写失败当下也会 renderAll()，如果那时就填回并清掉暂存，用户会看到「弹了失败提示但暂存没了」，
   万一随后平台跳登录失败，内容就真空了 —— 所以失败当场只存不取，留给下一次真实加载。
   骨架屏那次渲染走不到这里（sync==='loading' 会提前 return），所以不能靠在函数内置位来限次。
   门禁是 _allowRestore：只有 loadAll 首次拿到数据的那一帧会临时置 true。 */
function restoreLeftoverToForms(){
  if(!_allowRestore)return;
  var o=readLeftover();
  if(!o||!o.forms)return;
  var hit=0,rest={},restN=0;
  Object.keys(o.forms).forEach(function(gid){
    var f=o.forms[gid];
    var amt=document.getElementById('amt_'+gid);
    if(!amt){rest[gid]=f;restN++;return}   /* 目标已完成/已删除，暂存保留，去「我的」页提示 */
    amt.value=f.amt;
    var min=document.getElementById('min_'+gid);if(min&&f.min)min.value=f.min;
    var nt=document.getElementById('note_'+gid);if(nt&&f.note)nt.value=f.note;
    var sel=document.getElementById('date_'+gid);
    if(sel){
      var opt=[].find.call(sel.options,function(op){return op.value===f.date});
      if(opt)sel.value=f.date;else{f.date=sel.options.length?sel.options[0].value:todayKey();sel.value=f.date}
    }
    hit++;
  });
  if(restN)saveLeftover({t:Date.now(),date:todayKey(),forms:rest});
  else clearLeftover();
  if(hit){
    showToast('已填回你刚才没保存的 '+hit+' 项内容','success');
    renderMine();
  }
}

/* 卡片内的预案展示行 */
function planLineHtml(g){
  if(!g['应对策'])return'';
  return '<span class="plan-line">'+ic('target',12)+' 预案：'+esc(g['应对策'])+'</span>';
}

/* ===== 学习备注（第十二阶段）=====
   备注 = 挂在**单条打卡记录**上的自由文本，用来记「今天具体学了什么」：
   从第几页读到第几页、完成了哪个函数/模块、看了哪一讲视频。
   落在 checkins 表的「备注」字段（text 类型，字段早已存在，本次只是把它真正用起来）。 */
/* 读取一条记录的备注文本。
   ⚠️ 兼容历史写法：v23 及更早的 doCheckin 把「备注」当成补记标记、写死成 '补记'
      （真正的补记语义由「是否补记」checkbox 承担）。
      线上当前 12 条记录的备注列全为空（已核查），没有留下这类脏值；
      但读取侧仍然挡一道：备注恰为 '补记' 且该记录确实标了补记 → 视为旧标记、不当用户备注，
      否则每条补记上都会凭空多出一句莫名其妙的「补记」。
      反方向不误伤：用户真写了「补记」二字但没勾补记 → 照常当备注显示。 */
function noteOf(c){
  if(!c)return'';
  var n=(c['备注']===null||c['备注']===undefined)?'':String(c['备注']).trim();
  if(!n)return'';
  if(n==='补记'&&c['是否补记'])return'';
  return n;
}
/* 记录行下方的备注行。
   今日页 / 看板「最近记录」/ 看板「最近动态」/ 周报「本周打卡明细」/ 学习日志 共用这一段生成逻辑 ——
   口径集中在一处，才不会再出现「这里显示了、那里漏了」的不一致（本项目最费时的 bug 类型）。
   editable=true 时整行可点、可键盘激活（Enter / 空格），点击调 openEditNote(recordId) 直接改。
   ⚠️ 编辑入口做成「整行可点」而不是一颗小按钮：小按钮在手机上够不到 44px 铁律，
      而整行点击的触控面积天然够大。 */
function noteLineHtml(c,editable){
  var n=noteOf(c);
  if(!n&&!editable)return'';
  var cls='rec-note'+(editable?' rec-note-editable':'');
  var act=editable
    ? ' onclick="openEditNote(\''+c._id+'\')" onkeydown="noteKey(event,\''+c._id+'\')" role="button" tabindex="0" title="点击修改备注"'
    : '';
  var out='<div class="'+cls+'"'+act+'>'+
    '<span class="rec-note-ic">'+ic('note',12)+'</span>'+
    '<span class="rec-note-text'+(n?'':' rec-note-empty')+'">'+(n?esc(n):'未写备注')+'</span>'+
    (editable?('<span class="rec-note-edit-ic">'+ic('edit',12)+'</span>'):'')+
  '</div>';
  return out;
}
/* 备注行的键盘激活。抽成函数而不是在行内写 if(event.key===...)：
   行内写法要在 HTML 属性里再套一层引号转义，是「看着对、实际少个反斜杠就静默失效」的典型。 */
window.noteKey=function(e,recordId){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();window.openEditNote(recordId)}
};

/* A2：本周打卡节奏（周一至周日 7 格）
   ⚠️ 判据是「这天有没有打卡」（笔数 > 0），**不是**「有没有填分钟数」。
      原来只看分钟，导致用户只填数量不填分钟时，本周已投入显示 0 分钟、格子也不亮，
      与他「今天明明打过卡」的认知直接冲突。
      现在：格子亮 = 有打卡；格内优先显示分钟，没填分钟则显示数量，都没有显示「已打卡」。 */
function renderWeekRhythm(){
  var active=S.goals.filter(function(g){return g['状态']!=='已完成'&&g['状态']!=='已归档'&&!isGoalComplete(g)});
  if(!active.length)return'';
  var t=todayKey(),mon=weekStart(new Date());
  var CN=['一','二','三','四','五','六','日'];
  var cells='',totalMin=0,totalCnt=0,totalAmt=0;
  for(var i=0;i<7;i++){
    var d=addDays(mon,i),dk=dkey(d);
    var m=minutesOn(null,dk),cnt=checkinCountOn(null,dk),amt=amountOn(null,dk);
    totalMin+=m;totalCnt+=cnt;totalAmt+=amt;
    var future=dk>t;
    var hit=cnt>0;                                    /* 有打卡就算亮，不依赖分钟 */
    var cls='rhythm-day'+(hit?' hit':'')+(dk===t?' today':'')+(future?' future':'');
    /* 格内文案优先级：分钟 > 数量（都带上单位语义，避免「24」看不出是什么） */
    var valTxt='';
    if(m>0)valTxt=m+'分';
    else if(cnt>0)valTxt=trimNum(amt);                /* 没填分钟就给数量，别留空 */
    cells+='<div class="'+cls+'"><div class="rd">'+CN[i]+'</div>'+
      '<div class="rm">'+(hit?'✓':(future?'':'·'))+'</div>'+
      '<div class="rv">'+valTxt+'</div></div>';
  }
  /* 标题栏：主打「打卡天数」（永远有意义），分钟作为补充信息。
     原来只显示分钟，用户没填分钟时这里恒为 0，等于把一个选填字段当成了核心指标。 */
  var note='本周已打卡 <b>'+totalCnt+'</b> 次 · <b>'+countDays(null,mon)+'</b> 天';
  note+=totalMin>0?(' · '+totalMin+' 分钟'):(totalCnt>0?(' · 未记分钟'):'');
  var out='<div class="card"><div class="card-title">'+ic('calendar',16)+' 本周打卡节奏'+
    '<span class="card-title-note">'+note+'</span></div>'+
    '<div class="rhythm">'+cells+'</div></div>';
  return out;
}
/* 本周有打卡的天数 */
function countDays(gid,mon){
  var t=todayKey(),n=0;
  for(var i=0;i<7;i++){
    var dk=dkey(addDays(mon,i));
    if(dk>t)break;
    if(checkinCountOn(gid,dk)>0)n++;
  }
  return n;
}

/* C1：今日页卡片瘦身（核心数字留在看板） */
function renderGoalCard(g){
  var cl=COLORS[g['配色']]||COLORS.purple;
  /* color  给「色块」用（左侧色条、色点、进度条）—— 亮色更醒目
     colorInk 给「文字」用（完成量、剩余量、建议量）—— 够深才读得清 */
  var color=cl.p,colorInk=cl.ink,t=todayKey();
  var done=goalTotal(g._id);
  var rate=getCompletionRate(g);
  var sug=getTodaySuggested(g);
  var st=calculateStreak(g._id);
  var od=isOverdue(g);
  var checked=hasCheckinOn(g._id,t);
  var todayAmt=goalTodayTotal(g._id);
  var complete=isGoalComplete(g);
  var remDays=getRemainingDays(g);
  var unit=g['单位']||'';

  var badge='';
  if(complete)badge='<span class="badge badge-done">已完成</span>';
  else if(od)badge='<span class="badge badge-overdue">已逾期</span>';

  var html='<div class="card goal-card fade-in'+(checked?' is-checked':'')+(od?' is-overdue':'')+'" style="--accent:'+color+'"><span class="card-accent"></span><div class="card-body">';

  /* 卡片头部：目标头像块（配色底 + 首字）+ 名称 + 状态徽标 + 编辑按钮。
     头像块的底用配色浅档、字用同色墨色，两个令牌都过了对比度校验（≥4.7:1），

  html+='<div class="card-head"><span class="goal-avatar" style="background:'+cl.bg+';color:'+colorInk+'" aria-hidden="true">'+esc(firstChar(g['目标名称']))+'</span><div class="goal-name" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK">'+esc(g['目标名称'])+'</div>'+badge;
  html+='<button class="btn-icon" onclick="openEditGoal(\''+g._id+'\')" aria-label="编辑目标">'+ic('edit',16)+'</button>';
  html+='</div>';

  html+='<div class="goal-line" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK">'+

    (!complete&&!od

          ? ' · 剩余 <b style="color:'+colorInk+'">'+trimNum(getRemaining(g))+'</b> '+esc(unit)

  if(complete){

  }else{

    }
    /* 无截止日时不预填「剩余全部」—— 那是误导，会让人以为得一次做完。
       留空 + placeholder 提示，用户自己填今天实际做了多少。 */
    var amtAttr = remDays===null
      ? 'placeholder="'+trimNum(getRemaining(g))+'（剩余）"'

    /* 打卡成功的那一次渲染，给按钮挂 is-success 播一次性回弹（配合样式表「成功回弹」）。
       ⚠️ 门禁在调用方（doCheckin 写 S._popId），这里**消费一次即清**，且只认 id 命中的目标。
          若改成「凡是 btn-success 就播」，每次刷新重渲染都会重播 —— 按钮会一直闪。 */
    var popCls=(S._popId&&S._popId===g._id)?' is-success':'';

      '<div class="field"><label for="date_'+g._id+'">日期</label>'+
        '<select id="date_'+g._id+'">'+dateOpts+'</select></div>'+
      /* 学习备注：整行独占、可选。placeholder 直接给出三种最常见的写法，
         免得用户对着空框不知道「该写多细」而干脆不写。 */
      '<div class="field note-field"><label for="note_'+g._id+'">学习备注（可选）</label>'+
        '<textarea id="note_'+g._id+'" rows="2" maxlength="500" placeholder="这次具体学了什么？例：第 12–35 页，重点看懂 agg 的用法 / 完成登录接口并跑通 / 看完第 3 讲"></textarea></div>'+
      (S.readonly
        ? '<button class="btn btn-outline checkin-btn" onclick="confirmLoginToCheckin(\''+g._id+'\')">'+ic('lock',16)+'登录后打卡</button>'

    '</div>';
    if(S.readonly)html+='<div class="today-note" style="color:var(--amber)">'+ic('lock',12)+'内容填好了也不会丢：点上面按钮登录，回来自动填回。</div>';
    if(checked)html+='<div class="today-note">'+ic('check',14)+'今天已 +'+trimNum(todayAmt)+' '+esc(unit)+'，可以继续追加。</div>';
    /* 今天打过的每一笔都摊在卡片里，带各自的学习备注 ——
       打卡后最想确认的两件事就是「这一笔存下来没有」和「我写的那句话在不在」。
       ⚠️ 未写备注的也显示（灰色「未写备注」），因为这里的备注行是**可点的**，
          等于给当天漏写的内容留了一个就地补写的入口。 */
    if(checked){

      if(todayRecs.length){

          html+='<div class="record-item"><span class="record-amt">+'+trimNum(c['数量']||0)+' '+esc(unit)+'</span>'+

          html+=noteLineHtml(c,true);

    if(g['最大障碍'])html+='<div class="plan-row"><span class="plan-label">障碍：</span><span class="plan-value" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK">'+esc(g['最大障碍'])+'</span></div>';
    if(g['应对策'])html+='<div class="plan-row"><span class="plan-label">对策：</span><span class="plan-value" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK">'+esc(g['应对策'])+'</span></div>';
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

/* 看板目标卡：进度环 + 三个核心数字 + 预案 + 最近 10 条可删记录 */
function renderBoardCard(g){
  var cl=COLORS[g['配色']]||COLORS.purple;
  var color=cl.p,colorInk=cl.ink;
  var rate=getCompletionRate(g);
  var streak=calculateStreak(g._id);
  var est=getEstimatedCompletionDetail(g);

  var total=g['总量']||0;

  var circ=2*Math.PI*34;
  var offset=circ*(1-rate/100);
  html+='<div class="progress-ring-wrap">';
  html+='<svg class="progress-ring" width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="34" fill="none" stroke="'+cl.bg+'" stroke-width="7"/><circle cx="45" cy="45" r="34" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+circ.toFixed(1)+'" stroke-dashoffset="'+offset.toFixed(1)+'" transform="rotate(-90 45 45)"/><text x="45" y="42" text-anchor="middle" font-size="16" font-weight="500" fill="'+colorInk+'">'+rate+'%</text><text x="45" y="56" text-anchor="middle" font-size="9" fill="var(--muted)">完成率</text></svg>';

  html+='<div style="flex:1;min-width:0">';
  html+='<div class="stats-row" style="margin-bottom:8px">';
  html+='<div class="stat"><div class="stat-num">'+trimNum(done)+'/'+trimNum(total)+'</div><div class="stat-label">'+esc(unit)+'</div></div>';
  html+='<div class="stat"><div class="stat-num" style="color:var(--amber)">'+streak+'</div><div class="stat-label">连续天数</div></div>';
  html+='</div>';
  var estHtml='';
  if(est.status==='completed')estHtml='<span style="color:var(--success)">已完成</span>';
  else if(est.status==='ok'){
    /* diff===null 表示目标没设截止日，不能落进下面「准时」分支 —— JS 里 null>0 和 null<0 都是 false */
    if(est.diff===null||est.diff===undefined)estHtml='<span style="font-size:12px">未设截止日</span>';
    else if(est.diff>0)estHtml='<span style="color:var(--success)">提前'+est.diff+'天</span>';
    else if(est.diff<0)estHtml='<span style="color:var(--danger)">拖后'+(-est.diff)+'天</span>';
    else estHtml='<span style="color:var(--success)">准时</span>';
    estHtml+=' <span style="font-size:12px">('+fmtDateShort(dkey(est.date))+')</span>';
  }else{
    estHtml='<span style="font-size:12px">暂无推算（近 7 天打卡不足 3 天）</span>';
  }
  html+='<div style="font-size:13px;color:var(--muted)">预计完成：'+estHtml+'</div>';
  html+='</div></div>';

  if(g['最大障碍']||g['应对策']){

    if(g['应对策'])html+='<div class="plan-row"><span class="plan-label">对策：</span><span class="plan-value" data-sp-bindable="database" data-sp-database-id="OereifjY46k3XWmQX6KVfK">'+esc(g['应对策'])+'</span></div>';

    recs.forEach(function(r){
      var d=parseDate(r['日期']),dk=dkey(d);

      else dl=(dk===todayKey()?'今天':fmtDateShort(dk)+' 周'+weekDay(d));

    });
  }
  html+='</div></div>';

}

/* A1-1：近 35 天打卡热力图（周一左对齐，5 级色阶）
   ⚠️ 判据同节奏格：**有打卡就上色**，不要求填了分钟数。
      原来只按分钟分色阶，导致「打了卡但没填分钟」的日子在热力图上跟「没打卡」长得一样。
      现在的色阶口径：
        - 填了分钟 → 按分钟分 1~4 级（保持原有语义「颜色越深投入越多」）
        - 没填分钟但有打卡 → 给最低一级 l1，表示「这天有动作」
      title 里把两种信息都写清楚，鼠标悬停能分辨。 */
function renderHeatmap(){
  if(S.checkins.length===0)return'';
  var start=addDays(new Date(),-34);start.setHours(0,0,0,0);
  var offset=Math.round(daysBetween(weekStart(start),start));
  var cells='';
  for(var i=0;i<offset;i++)cells+='<span class="heat-cell blank"></span>';
  for(var j=0;j<35;j++){
    var d=addDays(start,j),dk=dkey(d);
    var m=minutesOn(null,dk),cnt=checkinCountOn(null,dk),amt=amountOn(null,dk);
    var lv;
    if(m>0)lv=m<30?1:m<60?2:m<90?3:4;      /* 有分钟：按投入量分色阶 */
    else if(cnt>0)lv=1;                     /* 没分钟但有打卡：最低一级，至少能看出这天做了 */
    else lv=0;                              /* 真没打卡 */
    var tip;
    if(m>0)tip=dk+' · '+m+' 分钟'+(cnt>1?(' · '+cnt+' 笔'):'');
    else if(cnt>0)tip=dk+' · 有打卡（'+cnt+' 笔，未记分钟）· 合计 '+trimNum(amt);
    else tip=dk+' · 未打卡';
    cells+='<span class="heat-cell'+(lv>0?' l'+lv:'')+(dk===todayKey()?' today':'')+'" title="'+tip+'"></span>';
  }
  var out='';
  out+='<div class="card fade-in" style="margin-top:14px">'+
    '<div class="card-title">'+ic('calendar',16)+' 近 35 天打卡热力<span class="card-title-note">颜色越深投入越多</span></div>'+
    '<div class="heat-days"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>'+
    '<div class="heat-grid">'+cells+'</div>'+
    '<div class="heat-legend">少<span class="heat-cell"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span><span class="heat-cell l4"></span>多</div>'+
  '</div>';
  return out;
}

/* A1-3：学习日志（第十二阶段新增）
   把每条打卡记录上的备注按日期串成流水，专门解决「随时回看自己每天到底学了什么」。
   与「最近动态」的分工：动态是最近 8 条概览、只读；日志覆盖近 14 天、按天分组，
   而且**每条都能点开改写或补写** —— 哪天忘了写，直接在日志里补上，不用去翻那条记录。
   ⚠️ 两道上限（近 14 天 + 最多 30 笔）：看板本来就很长，没有上限的话这张卡用久了会无限膨胀。
   ⚠️ 只收「有日期且能解析」的记录：日期缺失的记录按日期分组会落到 'NaN-NaN-NaN' 键上，
      混进排序里会把整张日志的顺序搅乱（周报明细那边有 '__bad__' 兜底分组，这里不重复造一套）。 */
function renderStudyLog(){
  if(!S.checkins.length)return'';
  var t=todayKey();
  var from=dkey(addDays(new Date(),-13));          /* 近 14 天，含今天 */
  var recs=S.checkins.filter(function(c){
    if(isOrphanCheckin(c))return false;            /* 孤儿记录（目标已删）不进日志，否则出现无主条目 */
    var dk=dkey(parseDate(c['日期']));
    return dk>=from&&dk<=t;
  }).sort(function(a,b){return parseDate(b['日期'])-parseDate(a['日期'])});

  var MAX=30;
  var truncated=recs.length>MAX;
  if(truncated)recs=recs.slice(0,MAX);

  var CN=['日','一','二','三','四','五','六'];
  var groups={},order=[];
  recs.forEach(function(r){
    var dk=dkey(parseDate(r['日期']));
    if(!groups[dk]){groups[dk]=[];order.push(dk)}
    groups[dk].push(r);
  });
  order.sort(function(a,b){return a<b?1:-1});      /* 零填充日期串，字符串比较即时间倒序 */

  var body='',noteCnt=0;
  order.forEach(function(dk){
    var d=parseDate(dk);
    var dayAmt=0,dayMin=0,dayNotes=0,rows='';
    groups[dk].forEach(function(r){
      var g=goalById(r['目标ID']);
      var cl=g?(COLORS[g['配色']]||COLORS.purple):COLORS.purple;
      var nm=g?g['目标名称']:'（目标已删除）';
      var unit=g?(g['单位']||''):'';
      var nt=noteOf(r);
      dayAmt+=(r['数量']||0);dayMin+=(r['分钟数']||0);if(nt)dayNotes++;
      rows+='<div class="log-item">'+
        '<span class="color-dot" style="background:'+cl.p+';width:8px;height:8px;flex:0 0 auto;margin-top:7px"></span>'+
        '<div class="log-body">'+
          '<div class="log-meta">'+esc(nm)+' · +'+trimNum(r['数量']||0)+' '+esc(unit)+
            (r['分钟数']>0?(' · 用时 '+r['分钟数']+' 分钟'+minUnitHint(unit,r['分钟数'])):'')+
            (r['是否补记']?' · <span class="record-tag">补</span>':'')+
          '</div>'+
          /* 备注行整行可点：有备注→改，没备注→补写。空态写成「未写备注 · 点此补写」，
             否则用户只会看到一片灰字、不知道这里其实可以点。 */
          '<div class="log-note'+(nt?'':' is-empty')+'" onclick="openEditNote(\''+r._id+'\')" onkeydown="noteKey(event,\''+r._id+'\')" role="button" tabindex="0" title="点击'+(nt?'修改备注':'补写备注')+'">'+
            (nt?esc(nt):'未写备注 · 点此补写')+'</div>'+
        '</div>'+
        '<button class="btn-icon danger record-del" onclick="deleteRecord(\''+r._id+'\')" aria-label="删除记录">'+ic('trash',14)+'</button>'+
      '</div>';
    });
    noteCnt+=dayNotes;
    var label;
    if(dk===t)label='今天';
    else if(dk===dkey(addDays(new Date(),-1)))label='昨天';
    else label=fmtDateShort(dk)+' 周'+CN[d.getDay()];
    body+='<div class="log-day"><div class="log-day-head">'+label+
      '<span class="log-day-sum">'+groups[dk].length+' 笔 · +'+trimNum(dayAmt)+
        (dayMin>0?(' · '+dayMin+' 分钟'):'')+
        (dayNotes>0?(' · 备注 '+dayNotes+' 条'):' · 未写备注')+
      '</span></div>'+rows+'</div>';
  });

  var out='<div class="card card-body learning-log fade-in" style="margin-top:14px" id="study-log">'+
    '<div class="card-title">'+ic('note',16)+' 学习日志'+
      '<span class="card-title-note">近 14 天 · '+recs.length+' 笔 · 备注 '+noteCnt+' 条'+(truncated?('（只显示最近 '+MAX+' 笔）'):'')+'</span></div>';
  if(!recs.length){
    out+='<div class="tiny" style="padding:8px 0 2px">近 14 天还没有打卡记录。在「今日打卡」记一笔并填上学习备注，这里就会按日期串成日志。</div>';
  }else{
    if(!noteCnt)out+='<div class="tiny" style="padding:8px 0 2px">还没有写过备注。点任意一条下面的「未写备注 · 点此补写」，就能给已有记录补上当天学了什么。</div>';
    out+=body;
  }
  return out+'</div>';
}

/* A1-2：最近动态（全局最近 8 条） */
function renderRecentFeed(){
  if(S.checkins.length===0)return'';
  var t=todayKey(),y=dkey(addDays(new Date(),-1));
  var logs=S.checkins.slice().sort(function(a,b){return parseDate(b['日期'])-parseDate(a['日期'])}).slice(0,8);
  var rows='';
  logs.forEach(function(l){
    var g=goalById(l['目标ID']);
    if(!g)return;
    var cl=COLORS[g['配色']]||COLORS.purple;
    var dk=dkey(parseDate(l['日期']));
    var dl=dk===t?'今天':dk===y?'昨天':fmtDateShort(dk);
    rows+='<div class="feed-row"><span class="feed-dot" style="background:'+cl.p+'"></span>'+
      '<div class="feed-main"><b>'+esc(g['目标名称'])+'</b> +'+trimNum(l['数量']||0)+' '+esc(g['单位']||'')+
        (l['分钟数']?' · 用时 '+l['分钟数']+' 分钟'+minUnitHint(g['单位'],l['分钟数']):'')+
        (l['是否补记']?' <span class="record-tag">补</span>':'')+
        /* 备注跟在这一行的下方。只读展示（可编辑入口在最近记录 / 周报明细 / 学习日志里）——
           这里是「发生了什么事」的流水，塞一个可点区域进来会让整列看着都能点。 */
        (noteOf(l)?('<div class="feed-note" title="'+esc(noteOf(l))+'">'+esc(noteOf(l))+'</div>'):'')+
        '</div>'+
      '<span class="feed-date">'+dl+'</span></div>';
  });
  var out='';
  out+='<div class="card fade-in" style="margin-top:14px">'+
    '<div class="card-title">'+ic('list',16)+' 最近动态</div>'+
    (rows||'<div class="tiny">暂无记录</div>')+'</div>';
  return out;
}

/* 近 14 天堆叠柱状图。
   ⚠️ 分钟数是选填的，只画分钟会出现「明明天天打卡，图表却说没有数据」。
      所以做双指标回退：**只要有任意一天填了分钟，就画分钟**（保持可比性）；
      **一天都没填分钟，则改画「投入量」**，并在标题上标明当前画的是哪个口径，
      避免把两种不同量纲的数字混在同一张图里比较。 */
function renderChart(){
  var today=new Date();today.setHours(0,0,0,0);
  var days=[];for(var i=13;i>=0;i--)days.push(addDays(today,-i));

  /* 先探一次：整个窗口内有没有人填过分钟 */
  var anyMin=0;
  S.checkins.forEach(function(c){if((c['分钟数']||0)>0)anyMin+=(c['分钟数']||0)});
  var useMin=anyMin>0;
  var field=useMin?'分钟数':'数量';

  var maxVal=0;
  var data=days.map(function(d){
    var dk=dkey(d);var perGoal={};
    S.goals.forEach(function(g){
      var v=0;goalCheckins(g._id).forEach(function(c){
        if(dkey(parseDate(c['日期']))===dk)v+=(c[field]||0);
      });
      if(v>0)perGoal[g._id]=v;
    });
    var total=0;Object.keys(perGoal).forEach(function(k){total+=perGoal[k]});
    if(total>maxVal)maxVal=total;
    return{date:d,total:total,perGoal:perGoal};
  });
  if(maxVal===0){
    return '<div class="card card-body empty" style="margin-top:16px">'+
      (useMin?'暂无数据，打卡后将显示图表':'近 14 天还没有打卡记录')+'</div>';
  }

  var chartW=Math.min(680,window.innerWidth-80);
  var chartH=180,barW=chartW/14*0.6,gap=chartW/14*0.4;
  var svg='<div class="card card-body chart-wrap fade-in"><div style="font-size:14px;font-weight:600;margin-bottom:8px">近14天投入'+(useMin?'分钟':'量')+
    (useMin?'':'<span style="font-size:11px;font-weight:400;color:var(--muted)">（这 14 天都没有填分钟数，改按目标各自的数量口径合计）</span>')+'</div>';
  svg+='<div class="chart-legend">';
  S.goals.forEach(function(g){var cl=COLORS[g['配色']]||COLORS.purple;svg+='<div class="legend-item"><div class="legend-dot" style="background:'+cl.p+'"></div>'+g['目标名称']+'</div>'});
  svg+='</div>';
  svg+='<svg width="'+chartW+'" height="'+(chartH+30)+'" viewBox="0 0 '+chartW+' '+(chartH+30)+'">';
  /* grid lines */
  for(var i=0;i<=4;i++){var y=chartH-i*chartH/4;svg+='<line x1="0" y1="'+y.toFixed(1)+'" x2="'+chartW+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="0.5"/>';svg+='<text x="0" y="'+(y-2).toFixed(1)+'" font-size="9" fill="var(--muted)">'+Math.round(maxVal*i/4)+'</text>'}
  days.forEach(function(d,i){
    var dp=data[i];var x=i*(barW+gap)+gap/2;
    var yOff=chartH;
    S.goals.forEach(function(g){
      var v=dp.perGoal[g._id]||0;
      if(v>0&&maxVal>0){
        var h=(v/maxVal)*chartH;var cl=COLORS[g['配色']]||COLORS.purple;
        svg+='<rect x="'+x.toFixed(1)+'" y="'+(yOff-h).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+cl.p+'" rx="2"/>';
        yOff-=h;
      }
    });
    var lbl=d.getMonth()+1+'/'+d.getDate();
    svg+='<text x="'+(x+barW/2).toFixed(1)+'" y="'+(chartH+14)+'" text-anchor="middle" font-size="8" fill="var(--muted)">'+lbl+'</text>';
  });
  svg+='</svg></div>';
  return svg;
}

/* 本周打卡明细：按日期倒序平铺（今天在最上面）。
   之前周报页只有汇总数字、没有明细，用户根本看不到「今天打了哪几笔」，
   会误以为「今天打的卡没进本周统计」——其实数字里算进去了，只是没地方显示。
   ⚠️ 传入的 weekRecs 已经过滤过孤儿记录，本函数不再重复过滤。 */
function renderWeekRecords(weekRecs,wsDate,today){
  var tk=todayKey();
  var CN=['日','一','二','三','四','五','六'];
  if(!weekRecs.length){
    return '<div class="card card-body" style="margin-top:12px">'+
      '<div class="card-title">'+ic('list',16)+' 本周打卡明细</div>'+
      '<div class="empty" style="padding:16px 0"><p>这一周还没有打卡记录</p></div></div>';
  }
  /* 按日期分组，日期倒序（今天最前），组内按记录时间倒序 */
  var groups={};
  weekRecs.forEach(function(r){
    var d=parseDate(r['日期']);
    var dk=isInvalid(d)?'__bad__':dkey(d);
    if(!groups[dk])groups[dk]=[];
    groups[dk].push(r);
  });
  var keys=Object.keys(groups).sort(function(a,b){
    if(a==='__bad__')return 1;              /* 日期缺失的沉到最底 */
    if(b==='__bad__')return -1;
    return a<b?1:-1;                        /* 字符串比较即可，零填充格式天然有序 */
  });

  var body='';
  var shown=0;
  keys.forEach(function(dk){
    var recs=groups[dk];
    /* 日期标题：今天/昨天特别标出来，让用户一眼确认今天在里面 */
    var label,isToday=false,extra='';
    if(dk==='__bad__'){
      label='<span style="color:var(--amber)">日期缺失</span>';
    }else{
      var d=parseDate(dk);
      var yd=addDays(today,-1);
      isToday=(dk===tk);
      if(isToday){label='今天';extra=' <span class="record-tag">今天</span>';}
      else if(dk===dkey(yd)){label='昨天';}
      else{label=fmtDateShort(dk)+' 周'+CN[d.getDay()];}
    }
    var dayAmt=0,dayMin=0;
    recs.forEach(function(r){dayAmt+=(r['数量']||0);dayMin+=(r['分钟数']||0)});

    body+='<div class="divider"></div>';
    body+='<div class="mini-title"'+(isToday?' style="color:var(--brand)"':'')+'>'+label+
      '<span style="float:right;font-weight:400">合计 '+trimNum(dayAmt)+
      (dayMin>0?' · '+dayMin+' 分钟':'')+'</span></div>';
    recs.forEach(function(r){
      var g=goalById(r['目标ID']);
      var cl=g?(COLORS[g['配色']]||COLORS.purple):COLORS.purple;
      var nm=g?g['目标名称']:('（目标已删除）');
      var unit=g?(g['单位']||''):'';
      var bf=r['是否补记']?'<span class="record-tag">补</span> ':'';
      body+='<div class="rec-wrap"><div class="record-item" data-sp-bindable="database" data-sp-database-id="DRuD6oQI5lrK5IhZQS1fzn">'+
        '<span class="color-dot" style="background:'+cl.p+';width:8px;height:8px;flex:0 0 auto"></span>'+
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+bf+esc(nm)+'</span>'+
        '<span class="record-amt">+'+trimNum(r['数量']||0)+' '+esc(unit)+'</span>'+
        '<span class="record-min">'+(r['分钟数']>0?('用时 '+r['分钟数']+'分'+minUnitHint(unit,r['分钟数'])):'')+'</span>'+
        '<button class="btn-icon danger record-del" onclick="deleteRecord(\''+r._id+'\')" aria-label="删除记录">'+ic('trash',14)+'</button>'+
      '</div>'+noteLineHtml(r,true)+'</div>';
      shown++;
    });
  });

  /* 卡片头把「本周分钟合计」也带上：明细里每条的分钟是散的，
     汇总数字要看上面那张「本周汇总」卡，来回扫容易漏。
     这里再给一次总数，用户核对「我填的分钟到底进没进统计」时一眼就能对上。 */
  var headMin=0,headCnt=0,headNote=0;
  weekRecs.forEach(function(r){headMin+=(r['分钟数']||0);headCnt++;if(noteOf(r))headNote++});
  return '<div class="card card-body" style="margin-top:12px" id="week-records">'+
    '<div class="card-title">'+ic('list',16)+' 本周打卡明细'+
      '<span class="card-title-note">共 <b>'+shown+'</b> 条'+
      (headMin>0?(' · 用时合计 <b>'+headMin+'</b> 分钟'):(headCnt?' · 未记用时':''))+
      /* 写了几条备注也摆出来：用户回看这一周时，一眼能看出「哪天只是打了卡、没有留下内容」，
         那些缺口正是最该补写的地方（每条备注都可以点开补）。 */
      ' · 有备注 <b>'+headNote+'</b> 条'+
      ' · 按日期倒序</span></div>'+
    body+'</div>';
}

/* 周报纯文本里的明细段：按日期倒序，每天一行列各目标的量。
   跟 renderWeekRecords 同口径，保证「页面上看到的」和「复制走的」一致。 */
function weekDetailText(weekRecs,today){
  if(!weekRecs.length)return'（本周没有打卡记录）';
  var tk=todayKey(),yd=dkey(addDays(today,-1));
  var groups={};
  weekRecs.forEach(function(r){
    var d=parseDate(r['日期']);
    var dk=isInvalid(d)?'__bad__':dkey(d);
    if(!groups[dk])groups[dk]=[];
    groups[dk].push(r);
  });
  var keys=Object.keys(groups).sort(function(a,b){
    if(a==='__bad__')return 1;
    if(b==='__bad__')return -1;
    return a<b?1:-1;
  });
  var lines=[];
  keys.forEach(function(dk){
    var recs=groups[dk];
    var label;
    if(dk==='__bad__')label='（日期缺失）';
    else if(dk===tk)label='今天';
    else if(dk===yd)label='昨天';
    else label=fmtDateShort(dk);
        var parts=recs.map(function(r){
          var g=goalById(r['目标ID']);
          /* 备注进纯文本前先把换行压成空格：这个函数的排版契约是「一天一行」，
             备注里的换行会把结构撑断，复制到周报/笔记里就散成一片。 */
          var nt=noteOf(r).replace(/\s+/g,' ');
          return (g?g['目标名称']:'（目标已删除）')+' +'+trimNum(r['数量']||0)+(g?(g['单位']||''):'')+
                 (r['分钟数']>0?('（用时 '+r['分钟数']+' 分钟）'):'')+
                 (r['是否补记']?'（补）':'')+
                 (nt?('　备注：'+nt):'');
        });
    lines.push('  '+label+'：'+parts.join('；'));
  });
  return lines.join('\n');
}

function renderWeekly(){
  var el=document.getElementById('tab-weekly');
  if(S.sync==='loading'){el.innerHTML='<div class="skeleton-h"></div>';return}
  var today=new Date();today.setHours(0,0,0,0);
  var thisWeekStart=weekStart(today);
  var wsDate=addDays(thisWeekStart,S.weekOffset*7);
  var weekEnd=addDays(wsDate,6);
  var nextDisabled=S.weekOffset>=0;

  var html='<div class="week-nav"><button class="btn-icon" onclick="changeWeek(-1)">'+ic('chevL',20)+'</button>';
  html+='<div class="week-display">'+fmtDate(dkey(wsDate))+' - '+fmtDate(dkey(weekEnd))+(S.weekOffset===0?' (本周)':S.weekOffset===-1?' (上周)':'')+'</div>';
  html+='<button class="btn-icon" '+(nextDisabled?'disabled style="opacity:.3"':'')+' onclick="changeWeek(1)">'+ic('chevR',20)+'</button></div>';

  /* Summary
     ⚠️ 必须排除孤儿记录（所属目标已被删除的打卡）。不清掉的话，用户删了目标，
        周报里的「打卡天数」「投入量」「分钟数」却还把它们算进去 ——
        表现为「本周打卡 4 天」但下面一个目标列表都没有他打过卡的痕迹，数字对不上。
        这也是用户点「清空示例数据」想解决的问题。 */
  var wsKey=dkey(wsDate),weKey=dkey(weekEnd);
  var weekRecs=S.checkins.filter(function(c){
    if(isOrphanCheckin(c))return false;
    var d=parseDate(c['日期']);d.setHours(0,0,0,0);return d>=wsDate&&d<=weekEnd;
  });
  var totalAmt=0,totalMin=0,daySet={};
  weekRecs.forEach(function(c){totalAmt+=(c['数量']||0);totalMin+=(c['分钟数']||0);daySet[dkey(parseDate(c['日期']))]=true});
  var dayCount=Object.keys(daySet).length;

  html+='<div class="week-summary" data-sp-bindable="database" data-sp-database-id="DRuD6oQI5lrK5IhZQS1fzn">';
  html+='<div class="week-stat"><div class="week-stat-num">'+totalAmt+'</div><div class="week-stat-label">投入量</div></div>';
  html+='<div class="week-stat"><div class="week-stat-num">'+dayCount+'</div><div class="week-stat-label">打卡天数</div></div>';
  /* 分钟数是选填的。有打卡却一分未记时显示「未记」，别把「没填」显示成「0」——
     0 会被读成「投入为零」，与旁边有值的投入量自相矛盾。 */
  var minCell=(totalMin>0)?String(totalMin)
    :(weekRecs.length?'<span style="font-size:13px;color:var(--muted)">未记</span>':'0');
  html+='<div class="week-stat"><div class="week-stat-num">'+minCell+'</div><div class="week-stat-label">分钟数</div></div>';
  html+='</div>';

  /* Compare —— 同样排除孤儿记录，否则「环比上周」的分母是被删目标的数字，
     涨跌幅会失真（上上周正是示例数据最多的时段，这一项偏差最明显）。 */
  var prevStart=addDays(wsDate,-7),prevEnd=addDays(weekEnd,-7);
  var prevRecs=S.checkins.filter(function(c){
    if(isOrphanCheckin(c))return false;
    var d=parseDate(c['日期']);d.setHours(0,0,0,0);return d>=prevStart&&d<=prevEnd;
  });
  var prevAmt=0,prevMin=0,prevDays={};
  prevRecs.forEach(function(c){prevAmt+=(c['数量']||0);prevMin+=(c['分钟数']||0);prevDays[dkey(parseDate(c['日期']))]=true});
  var prevDayCount=Object.keys(prevDays).length;
  function compare(cur,prev,unit){if(prev===0)return cur>0?'+'+cur+unit:'持平';var pct=Math.round((cur-prev)/prev*100);return(pct>=0?'+':'')+pct+'% ('+cur+'/'+prev+unit+')'}
  /* 分钟数两边都是 0 时标「两边都未记」，而不是显示「持平」——
     「持平」会让人以为有过对比，实际是两期都没数据。 */
  var minCmp=(totalMin===0&&prevMin===0&&(weekRecs.length||prevRecs.length))
    ?'两边都未记'
    :compare(totalMin,prevMin,'分');
  html+='<div class="week-compare">环比上周：投入量 '+compare(totalAmt,prevAmt,'')+' ｜ 打卡天数 '+compare(dayCount,prevDayCount,'天')+' ｜ 分钟数 '+minCmp+'</div>';

  /* ===== 本周打卡明细 =====
     ⚠️ 之前这里只有上面三个汇总数字，**没有任何记录列表** —— 用户报「本周打卡看不到今天
     打的卡」，查下来不是数据丢了、也不是被孤儿过滤误伤，而是这一页从来没渲染过明细。
     汇总数字（投入量/天数）用的是全量数据，所以数字是对的、今天也确实算进去了，
     只是界面上没有地方能看到「今天打了哪几笔」。
     现在按日期倒序（最近的在上）平铺列出，今天排最前。 */
  html+=renderWeekRecords(weekRecs,wsDate,today);

  /* Find existing weekly record */
  var existing=S.weeklies.find(function(w){return dkey(parseDate(w['周开始日期']))===wsKey});
  var canEdit=S.weekOffset>=0;

  html+='<div class="card card-body">';
  html+='<div class="form-group"><label class="form-label">保持</label><textarea class="form-textarea" id="wr_keep" '+(canEdit?'':'disabled')+'>'+(existing?existing['保持']||'':'')+'</textarea></div>';
  html+='<div class="form-group"><label class="form-label">问题</label><textarea class="form-textarea" id="wr_prob" '+(canEdit?'':'disabled')+'>'+(existing?existing['问题']||'':'')+'</textarea></div>';
  html+='<div class="form-group"><label class="form-label">尝试</label><textarea class="form-textarea" id="wr_try" '+(canEdit?'':'disabled')+'>'+(existing?existing['尝试']||'':'')+'</textarea></div>';
  html+='<div class="form-group"><label class="form-label">下周预案</label><textarea class="form-textarea" id="wr_plan" '+(canEdit?'':'disabled')+'>'+(existing?existing['下周预案']||'':'')+'</textarea></div>';
  if(canEdit)html+='<button class="btn btn-primary btn-block" onclick="saveWeekly(\''+wsKey+'\','+(existing?"'"+existing._id+"'":'null')+')">'+ic('check',16)+'保存复盘</button>';
  html+='</div>';

  html+='<div style="margin-top:12px"><button class="btn btn-outline btn-block" onclick="generateWeeklyText()">'+ic('copy',16)+'一键生成周报文本</button></div>';
  html+='<div id="weekly-text-output" style="margin-top:8px"></div>';

  el.innerHTML=html;
  /* 把本周口径数据挂到状态里，供 generateWeeklyText 读取，避免超长内联参数 */
  S.weekCtx={wsKey:wsKey,wsLabel:fmtDate(wsKey),weLabel:fmtDate(weKey),
    amt:trimNum(totalAmt),days:dayCount,mins:trimNum(totalMin),
    cmpAmt:compare(totalAmt,prevAmt,''),cmpDays:compare(dayCount,prevDayCount,'天'),cmpMins:compare(totalMin,prevMin,'分'),
    detail:weekDetailText(weekRecs,today)};
  if(canEdit){
    restoreForm('wk'+wsKey,['wr_keep','wr_prob','wr_try','wr_plan']);
    cacheForm('wk'+wsKey,['wr_keep','wr_prob','wr_try','wr_plan']);
  }
}

/* 同步状态只有一处判定，多个地方展示（品牌条徽标 + 工具条徽标 + 「我的」页）。
   ⚠️ 徽标是「宿主元素」，它自己就带 sync-badge 与 js-sync-badge 类，
   若把 getSyncBadgeHTML() 的结果整个塞进去，会套出两层 .sync-badge，
   样式被叠加两次（字重、内边距都会错）。所以拆成两种输出方式。
   ⚠️ 更新时用 classList 增删状态类，不能整串覆写 className —— 那会把 js-sync-badge
   一起冲掉，第二次更新就找不到元素了（静默失效，页面看上去只是「状态不刷新」）。 */
function syncState(){
  if(S.readonly)return{cls:'offline',icon:'lock',label:'只读模式'};
  if(S.sync==='synced')return{cls:'synced',icon:'check',label:'本地已保存'};
  if(S.sync==='syncing')return{cls:'syncing',icon:'sync',label:'同步中'};
  if(S.sync==='loading')return{cls:'syncing',icon:'sync',label:'连接中'};
  return{cls:'offline',icon:'alert',label:'未连接'};
}
function getSyncBadgeHTML(){
  var s=syncState();
  return'<span class="sync-badge '+s.cls+'">'+ic(s.icon,14)+'<span class="sb-label">'+s.label+'</span></span>';
}
function updateSyncBadge(){
  var s=syncState();
  var list=document.querySelectorAll('.js-sync-badge');
  for(var i=0;i<list.length;i++){
    var el=list[i];
    el.classList.remove('synced','syncing','offline');
    el.classList.add(s.cls);
    el.innerHTML=ic(s.icon,12)+'<span class="sb-label">'+s.label+'</span>';
    el.title=s.label;
  }
}

window.createGoal=function(){
  var name=document.getElementById('ng_name').value.trim();
  var unit=document.getElementById('ng_unit').value.trim();
  var total=parseFloat(document.getElementById('ng_total').value);
  var deadline=document.getElementById('ng_deadline').value;
  var colorEl=document.querySelector('.color-opt.selected');
  var color=colorEl?colorEl.getAttribute('data-color'):'purple';
  var obstacle=document.getElementById('ng_obstacle').value.trim();
  var strategy=document.getElementById('ng_strategy').value.trim();
  if(!name){showToast('请填写目标名称','error');return}
  if(!unit){showToast('请填写单位','error');return}
  if(!total||total<=0){showToast('请填写有效的总量','error');return}
  if(!deadline){showToast('请选择截止日期','error');return}
  /* 只收 YYYY-MM-DD：日期控件的值可能是被补记/暂存填进来的脏数据，
     存进去会变成 Invalid Date，回头渲染成「未设置」还不报错 */
  if(!/^\d{4}-\d{2}-\d{2}$/.test(deadline)){showToast('截止日期格式不对，请重新选择','error');return}
  if(parseDate(deadline)<new Date(new Date().setHours(0,0,0,0))){showToast('截止日期不能早于今天','error');return}

  var props={};
  props['目标名称']={text:name};
  props['单位']={text:unit};
  props['总量']={number:total};
  props['截止日期']={date:deadline};
  props['配色']={text:color};
  props['最大障碍']={text:obstacle};
  props['应对策']={text:strategy};
  props['标签']={select:'正常'};
  props['状态']={select:'进行中'};
  props['创建日期']={date:todayKey()};

  if(!db){showToast('当前环境无数据服务，请打开线上链接使用','error');return}
  /* 未登录会整页跳登录，先把用户填的目标内容存下来（表单已有 cacheForm，这里再兜一层写回前快照） */
  cacheForm('new',['ng_name','ng_unit','ng_total','ng_obstacle','ng_strategy']);
  db.addRecord({databaseId:DATABASE_ID,properties:props}).then(function(){
    showToast('目标创建成功','success');clearFormCache('new');hideModal();loadAll();
  }).catch(function(err){handleWriteError('创建目标',err)});
};

/* 「立即打卡」：滚动到目标卡片并聚焦数量输入框（今日页为行内打卡，无需弹窗） */
window.openCheckin=function(goalId){
  var amtEl=document.getElementById('amt_'+goalId);
  if(amtEl){
    amtEl.scrollIntoView({behavior:'smooth',block:'center'});
    setTimeout(function(){amtEl.focus();amtEl.select()},320);
    return;
  }
  var g=goalById(goalId);
  if(!g)return;
  showToast('「'+g['目标名称']+'」已达上限或已完成，无需打卡','error');

/* A4/A5：行内打卡 —— 支持日期下拉（今天/昨天/…/6天前），补记自动标「补」；
   达标判定用「前态未完成 → 后态完成」的边沿检测 */
window.doCheckin=function(goalId){
  var g=goalById(goalId);
  if(!g)return;
  var amtEl=document.getElementById('amt_'+goalId);
  var minEl=document.getElementById('min_'+goalId);
  var dateEl=document.getElementById('date_'+goalId);
  var noteEl=document.getElementById('note_'+goalId);
  if(!amtEl)return;
  var amount=parseFloat(amtEl.value);
  if(isNaN(amount)||amount<0){showToast('完成数量需为有效正数','error');amtEl.focus();return}
  var minutes=0;
  if(minEl&&minEl.value!==''){
    minutes=parseFloat(minEl.value);
    if(isNaN(minutes)||minutes<0||minutes>1440){showToast('用时需为 0–1440 分钟','error');minEl.focus();return}
  }
  /* 备注可选，但**不静默截断**：超过上限先告知再截，否则用户写了长段内容、
     存下去少了一截却完全没有任何提示（textarea 的 maxlength 只在交互输入时生效，
     粘贴/脚本改值时并不拦）。 */
  var note=noteEl?String(noteEl.value||'').trim():'';
  if(note.length>500){
    note=note.slice(0,500);
    showToast('备注超过 500 字，已保留前 500 字','error');
  }
  var date=(dateEl&&dateEl.value)?dateEl.value:todayKey();
  var earliest=dkey(addDays(new Date(),-6));
  if(date<earliest||date>todayKey())date=todayKey();
  var isBackfill=date<todayKey();

  var wasComplete=isGoalComplete(g);
  var props={};
  props['目标ID']={text:goalId};
  props['目标名称']={text:g['目标名称']};
  props['日期']={date:date};
  props['数量']={number:amount};
  props['分钟数']={number:minutes};
  props['是否补记']={checkbox:isBackfill};
  /* 「备注」从补记标记改为用户自由文本（第十二阶段）。
     补记语义由上面的「是否补记」checkbox 独立承担，不再挤占备注字段。 */
  props['备注']={text:note};

  if(!db){showToast('当前环境无数据服务，请打开线上链接使用','error');return}
  amtEl.disabled=true;
  /* 同时锁住打卡按钮本身：spinner 让「正在写」看得见，也堵掉连点造成的重复打卡
     （原先只 disable 了输入框，按钮没锁，网络慢时连点两下会写进两条一样的记录）。
     ⚠️ 用 closest('.checkin') 就地定位，不能用 querySelector('.checkin-btn') ——
        一屏上可能有好几个目标卡片，全局查询会锁到别人的按钮上。 */
  var _ckWrap=amtEl.closest?amtEl.closest('.checkin'):null;
  var _ckBtn=_ckWrap?_ckWrap.querySelector('.checkin-btn'):null;
  setBtnBusy(_ckBtn,true);
  /* 未登录时平台会整页跳登录，内存里的输入全丢 —— 先把这次要写的内容存起来 */
  var _left={t:Date.now(),date:todayKey(),forms:{}};
  /* 暂存里必须带上备注 —— 少存一个字段，用户登录回来后就会看到
     「数量/分钟/日期都填回来了，唯独写的那段备注没了」，这类半丢最难察觉也最恼人。 */
  _left.forms[goalId]={amt:String(amount),min:minEl?String(minEl.value||''):'',date:date,note:note};
  db.addRecord({databaseId:'DRuD6oQI5lrK5IhZQS1fzn',properties:props}).then(function(){
    clearLeftover();
    var nowComplete=((goalTotal(goalId)+amount)>=(g['总量']||0));
    showToast(isBackfill?('已补记 '+fmtDateShort(date)+'：+'+trimNum(amount)+' '+g['单位']):('已打卡 +'+trimNum(amount)+' '+g['单位']),'success');
    if(!wasComplete&&nowComplete){
      showConfetti();
      showToast('目标「'+g['目标名称']+'」达成，恭喜！','success');
    }
    S._justSynced=true;
    setBtnBusy(_ckBtn,false);
    /* 成功回弹：门禁交给渲染层消费一次（渲染层据此给按钮挂 is-success）。
       另配一个兜底清除 —— 万一这一轮渲染没能消费掉（例如用户中途切了 Tab），
       标记不会残留到下一次刷新，否则那颗按钮会在不相干的时刻自己弹一下。 */
    S._popId=goalId;
    setTimeout(function(){if(S._popId===goalId)S._popId=null},2000);
    loadAll();
  }).catch(function(err){handleWriteError('打卡',err,_left);amtEl.disabled=false;setBtnBusy(_ckBtn,false)});
};

/* ===== 学习备注的编辑（第十二阶段）=====
   入口是记录行上那条「备注行」——整行可点，有备注就是改、没备注就是补写。
   为什么不做成独立的小按钮：小按钮在手机上够不到 44px 触控铁律，
   而整行点击的可点面积天然够大。 */
window.openEditNote=function(recordId){
  var c=S.checkins.find(function(x){return x._id===recordId});
  if(!c){showToast('这条记录已不存在，请重新同步后再试','error');return}
  var g=goalById(c['目标ID']);
  var unit=g?(g['单位']||''):'';
  var d=parseDate(c['日期']);
  var meta=(g?g['目标名称']:'（目标已删除）')+' · '+
    (isInvalid(d)?'日期缺失':(fmtDateShort(dkey(d))+' 周'+weekDay(d)))+
    ' · +'+trimNum(c['数量']||0)+' '+unit+
    (c['分钟数']>0?(' · 用时 '+c['分钟数']+' 分钟'):'')+
    (c['是否补记']?' · 补记':'');
  var cur=noteOf(c);
  var html='<div class="modal-head"><div class="modal-title">'+(cur?'修改学习备注':'补写学习备注')+'</div><button class="modal-close" onclick="hideModal()">'+ic('close',20)+'</button></div>';
  /* 把「改的是哪一条」写清楚：一屏可能有好几条同目标的记录，
     只显示一个空文本框的话，用户没法确认自己改的是今天那条还是昨天那条。 */
  html+='<div class="tiny" style="padding:0 0 10px">'+esc(meta)+'</div>';
  html+='<div class="form-group"><label class="form-label">当天具体学了什么</label>'+
    '<textarea class="form-textarea" id="en_note" rows="5" maxlength="500" style="resize:vertical;line-height:1.55;font-family:inherit" placeholder="例：第 12–35 页，重点看懂 agg 的用法">'+esc(cur)+'</textarea>'+
    '<div class="tiny" style="padding:6px 0 0">最多 500 字。这段内容会出现在打卡记录、本周明细和「学习日志」里。</div></div>';
  if(S.readonly)html+='<div class="tiny" style="padding:0 0 10px;color:var(--amber)">当前是只读模式，备注存不进去。登录后即可修改。</div>';
  html+='<div style="display:flex;gap:8px">'+
    '<button class="btn btn-outline" style="flex:1" onclick="hideModal()">取消</button>'+
    '<button class="btn btn-primary" style="flex:1" id="en_save"'+(S.readonly?' disabled':'')+' onclick="saveNote(\''+recordId+'\')">保存备注</button>'+
  '</div>';
  showModal(html);
  /* 打开即聚焦、光标落到末尾：补写场景下用户是接着往下写，不是要覆盖全文 */
  setTimeout(function(){
    var el=document.getElementById('en_note');
    if(!el||!el.focus)return;
    el.focus();
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}
  },60);
};

window.saveNote=function(recordId){

  }
  if(!db){showToast('当前环境无数据服务，请打开线上链接使用','error');return}
  if(S.readonly){showToast('只读模式：请先登录再改备注','error');return}
  var btn=document.getElementById('en_save');
  setBtnBusy(btn,true);
  /* 只提交「备注」这一个字段。
     ⚠️ 刻意不把数量/分钟/日期一起带上：那样「改备注」就变成一次隐式的全字段重写，
        万一某个字段的读取/类型有偏差（本项目踩过：字段类型不匹配时服务端静默丢值），
        改一句备注就会顺带把别的字段写坏。 */
  db.updateRecord({databaseId:'DRuD6oQI5lrK5IhZQS1fzn',recordId:recordId,properties:{'备注':{text:note}}}).then(function(){
    setBtnBusy(btn,false);

       关掉的话字就跟着弹窗一起没了（这条是「破坏性操作静默失败」的同类陷阱）。 */
    handleWriteError('保存备注',err);
  });
};

/* ====== Form Draft Cache (localStorage) ====== */
function cacheForm(prefix,ids){
  ids.forEach(function(id){
    var el=document.getElementById(id);
    if(!el||el.disabled)return;
    var key='form_'+prefix+'_'+id;
    el.addEventListener('input',function(){
      try{localStorage.setItem(key,el.value)}catch(e){}
    });
  });
}
function restoreForm(prefix,ids){
  ids.forEach(function(id){
    var el=document.getElementById(id);
    if(!el)return;
    try{
      var v=localStorage.getItem('form_'+prefix+'_'+id);
      if(v!==null)el.value=v;
    }catch(e){}
  });
}
function clearFormCache(prefix){
  var pre='form_'+prefix+'_';
  try{
    var keys=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf(pre)===0)keys.push(k);
    }
    keys.forEach(function(k){localStorage.removeItem(k)});
  }catch(e){}
}

/* ====== UI Helpers ====== */
function showModal(html){var o=document.getElementById('modal-overlay');var c=document.getElementById('modal-content');c.innerHTML=html;o.classList.remove('hidden')}
function hideModal(){document.getElementById('modal-overlay').classList.add('hidden')}
function showToast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast'+(type?' '+type:'');setTimeout(function(){t.classList.add('hidden')},3000)}
/* 写失败统一出口：区分「需要登录」和「真失败」。
   需要登录时不能只弹 toast —— 平台随后会整页跳登录，toast 会消失、用户以为卡死了。
   所以：置 readonly → 重渲染出黄色告警条（带「去登录」按钮）→ 再弹一句 toast 说明。 */
function handleWriteError(action,err,leftover){
  var msg=String((err&&err.message)||err||'');
  console.error('[db] '+action+':',err);
  var isAuth=(msg.indexOf('401')>=0||msg.indexOf('not login')>=0||msg.toLowerCase().indexOf('login')>=0||msg.indexOf('AUTH')>=0||/^\{\}$/.test(msg));
  if(isAuth){
    S.readonly=true;
    if(leftover)saveLeftover(leftover);
    renderAll();
    showToast('还没登录，内容已暂存 · 登录后自动填回','error');
    var bar=document.querySelector('#tab-today .alert-card.yellow');
    if(bar&&bar.scrollIntoView)try{bar.scrollIntoView({block:'center'})}catch(e){bar.scrollIntoView()}
  }else if(msg.indexOf('offline')>=0||msg.indexOf('timeout')>=0||msg.indexOf('timed out')>=0){
    showToast('网络超时，'+action+'失败，请重试','error');
  }else{
    showToast(action+'失败，请重试','error');
  }
}
function showConfetti(){
  /* 彩带直接用目标配色令牌，跟着主题走；暗色下自动换成提亮版，
     否则深底上撒一把深紫彩带根本看不见 */
  var colors=COLOR_KEYS.map(function(k){return 'var(--gc-'+k+')'});
  var c=document.getElementById('confetti-container');
  for(var i=0;i<50;i++){
    var p=document.createElement('div');
    p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay=Math.random()*0.5+'s';
    p.style.animationDuration=(2+Math.random()*2)+'s';
    p.style.width=(6+Math.random()*8)+'px';
    p.style.height=p.style.width;
    if(Math.random()>0.5)p.style.borderRadius='50%';
    c.appendChild(p);
    setTimeout(function(el){return function(){el.remove()}}(p),4000);
  }
}

/* ====== Tab Switching ====== */
/* 吸顶工具条的标题与主操作按钮随 Tab 变化。
   这段 DOM 在 .content 里、且在 .tab-panel 之外 —— 各 Tab 渲染时用 innerHTML 覆写自己的容器，
   碰不到工具条，所以只需要在切换时更新一次。 */
var TAB_META={
  today:{name:'今日打卡',icon:'calendar'},
  dashboard:{name:'进度看板',icon:'grid'},
  weekly:{name:'周报复盘',icon:'report'},
  mine:{name:'我的',icon:'user'}
};
function updateTopbar(){
  var meta=TAB_META[S.tab]||TAB_META.today;
  var icon=document.getElementById('topbar-icon');
  var title=document.getElementById('topbar-title');
  if(icon)icon.innerHTML=ic(meta.icon,18);
  if(title)title.textContent=meta.name;
  document.title=meta.name+' · 学习目标管理台';
  /* 主操作按钮：每个模块一个「这个页面最该干的事」，比在页面里堆一排按钮更像仪表盘 */
  var act=document.getElementById('topbar-action');
  if(!act)return;
  if(S.tab==='today'){
    act.style.display='';
    act.innerHTML=ic('plus',16)+'新建目标';
    act.onclick=function(){window.openNewGoal()};
  }else if(S.tab==='weekly'){
    act.style.display='';
    act.innerHTML=ic('copy',16)+'生成周报';
    act.onclick=function(){window.generateWeeklyText()};
  }else{
    act.style.display='none';
    act.onclick=null;
  }
}

function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.nav-item').forEach(function(b){
    var on=b.getAttribute('data-tab')===tab;
    b.classList.toggle('active',on);
    b.setAttribute('aria-selected',on?'true':'false');
  });
  document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.toggle('active',p.id==='tab-'+tab)});
  /* 标题与主操作跟着走：这里只更新工具条，不去动各 Tab 的内容（各 Tab 自己渲染） */
  updateTopbar();
  if(tab==='dashboard')renderDashboard();
  if(tab==='weekly')renderWeekly();
  if(tab==='mine')renderMine();
}

/* ====== 按钮动效（配合样式表末尾的「按钮动效层」） ====== */

/* 涟漪：用事件委托挂在 document 上。
   ⚠️ 绝不能「初始化时 querySelectorAll('.btn') 再逐个 addEventListener」——
      本页按钮几乎全部由 innerHTML 动态生成，每次重渲染都会换掉 DOM，
      逐个绑只会绑到已被丢弃的节点上：点了没有任何反应，且不报任何错。
   ⚠️ 用 pointerdown 不用 click：click 要等 pointerup 才触发，按下瞬间没反馈。
      键盘回车/空格走的是 click（没有坐标），那条路径交给聚焦环 + 成功回弹兜底。 */
var RIPPLE_SEL='.btn-primary,.btn-success,.btn-danger,.btn-amber';
document.addEventListener('pointerdown',function(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var b=t.closest(RIPPLE_SEL);
  if(!b||b.disabled)return;
  var r=b.getBoundingClientRect();
  if(!r.width)return;
  var d=Math.max(r.width,r.height)*2.2;
  var s=document.createElement('span');
  s.className='ripple';
  s.style.width=s.style.height=d+'px';
  s.style.left=(e.clientX-r.left)+'px';
  s.style.top=(e.clientY-r.top)+'px';
  b.appendChild(s);
  /* 到点就删，否则连点会攒一堆节点。用 setTimeout 而不是 animationend：
     按钮可能在这期间被重渲染换掉，那时永远不会有 animationend，节点就漏在内存里。 */
  setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s)},700);
},true);

/* 按钮忙碌态：写库期间锁住按钮 + 显示环形 spinner。
   ⚠️ 这条首先是防重复提交、其次才是动效 —— 打卡按钮原先没有锁，
      网络慢时连点两下会往库里写两条一模一样的记录。 */
function setBtnBusy(btn,on){
  if(!btn)return;
  if(on){btn.classList.add('is-busy');btn.setAttribute('aria-busy','true')}
  else{btn.classList.remove('is-busy');btn.removeAttribute('aria-busy')}
}

/* ====== Init ====== */
function renderSkeleton(){
  renderToday();renderDashboard();renderWeekly();renderMine();
  document.querySelectorAll('.nav-item').forEach(function(b){
    b.onclick=function(){switchTab(b.getAttribute('data-tab'))};
  });
  /* 工具条的标题/主操作按钮也要在首帧填好，否则会看到一个空白标题 */
  updateTopbar();
  document.getElementById('modal-overlay').onclick=function(e){if(e.target===e.currentTarget)hideModal()};
}

/* 先把主题控件的图标/文案对齐 —— 首屏数据还没回来，但顶栏已经在屏幕上了，
   不能等到 loadAll 完成才填图标，否则会看到一个空按钮。 */
applyTheme();
/* 骨架屏这一次渲染是「刷新 / 登录回来」后的首屏，允许填回暂存；
   从第二帧起（所有后续 renderAll）只做展示，不再动暂存 ——
   否则写失败当场 renderAll() 就会把刚存下的内容又填回并清掉。 */
renderSkeleton();
loadAll();
/* ====== Global exports for inline onclick handlers ====== */
window.loadAll=loadAll;
window.hideModal=hideModal;
/* 排障出口：出问题时在控制台敲 __S.readonly / __S.sync 看真实状态，
   __dbg.loginHref() 看待登录跳转地址，__dbg.leftover() 看暂存内容，
   __dbg.dateCheck() 一次性核对所有目标的日期读回情况（字段没存上会立刻暴露）。
   （这些辅助函数都包在 IIFE 里，不从这里放出来就在控制台拿不到。） */
window.__S=S;
window.__dbg={
  readonly:function(){return S.readonly},
  loginHref:function(){return buildLoginHref()},
  leftover:function(){return readLeftover()},
  saveLeftover:saveLeftover,
  clearLeftover:clearLeftover,
  restore:restoreLeftoverToForms,
  /* 按钮忙碌态的开/关。放出来有两个用处：
     ① 线上排查「点了没反应」时，可以手动 setBtnBusy(某按钮,true) 看是不是卡住了；
     ② 自动化验证能直接调它，而不是自己 classList.add('is-busy') ——
        后者会绕过 aria-busy 的设置，测出来的是「类生效了但属性没写」的假象。 */
  setBtnBusy:setBtnBusy,
  parseDate:parseDate,
  isInvalid:isInvalid,
  /* 一眼看出「哪些目标的日期其实是空的」—— 这类问题以前完全静默 */
  dateCheck:function(){
    return S.goals.map(function(g){
      return {
        名称:g['目标名称'],
        截止原始:g['截止日期'],
        截止可用:hasDeadline(g),
        剩余天数:getRemainingDays(g),
        建议量:getTodaySuggested(g),
        创建原始:g['创建日期'],
        创建可用:!isInvalid(parseDate(g['创建日期']))
      };
    });
  },
  /* 核对「周报口径」与「今天打卡」是否对得上 —— 排查「看不到今天的卡」用这个，
     一次给出：全表条数 / 今天条数 / 本周明细卡渲染条数 / 孤儿条数。 */
  weekCheck:function(){
    var tk=todayKey();
    var todays=S.checkins.filter(function(c){return dkey(parseDate(c['日期']))===tk});
    var card=document.getElementById('week-records');
    var totalMin=0,totalCnt=0;
    S.checkins.forEach(function(c){
      if(isOrphanCheckin(c))return;
      var dk=dkey(parseDate(c['日期']));
      if(dk>=dkey(weekStart(new Date()))&&dk<=tk){
        totalMin+=(c['分钟数']||0);totalCnt++;
      }
    });
    return {
      页面今天:tk,
      全表打卡条数:S.checkins.length,
      今天条数:todays.length,
      今天明细:todays.map(function(c){
        var g=goalById(c['目标ID']);
        return (g?g['目标名称']:'(已删目标)')+' +'+trimNum(c['数量']||0)+(g?(g['单位']||''):'')+
               (c['分钟数']>0?(' · 用时 '+c['分钟数']+'分钟'):' · 未记分钟');
      }),
      /* ⚠️ 专门为「我明明填了分钟，怎么没识别」这类问题准备的逐条清单。
         排查时先看这里：只要「分钟数」有值，就说明**写入没问题**，
         问题在显示口径（例如目标单位本来就是「小时」，1 小时 + 用时60分钟并排显示
         会像同一件事说了两遍）。别一上来就怀疑数据丢了。 */
      今天分钟核对:todays.map(function(c){
        var g=goalById(c['目标ID']);
        return {
          目标:g?g['目标名称']:'(已删目标)',
          单位:g?(g['单位']||''):'',
          数量:c['数量']||0,
          分钟数:c['分钟数']||0,
          写入状态:(c['分钟数']||0)>0?'已保存':'未填写/为0（选填字段，未填即为0）'
        };
      }),
      本周明细卡:card?card.querySelectorAll('.record-item').length:'(未渲染该Tab)',
      本周汇总:S.weekCtx?{投入量:S.weekCtx.amt,天数:S.weekCtx.days,
        /* ⚠️ 这里给的是**原始分钟累计**（没记就是 0），不是界面上那个「未记」。
           周报页在分钟为 0 且本周有打卡时会把 0 显示成「未记」，两者不一致是**故意的**：
           0 = 事实（数据里确实没分钟），「未记」= 给用户看的措辞（避免被读成「投入为零」）。
           排障时看这个字段判断事实，看界面判断措辞，别把两者混为一谈。 */
        分钟原始累计:S.weekCtx.mins,
        分钟显示为:S.weekCtx.mins==='0'&&S.weekCtx.days>0?'未记':S.weekCtx.mins}:null,
      /* 节奏/热力图口径：判据是「有没有打卡」，不是「有没有分钟」 */
      本周节奏口径:{打卡笔数:totalCnt,分钟合计:totalMin,
        说明:totalCnt>0&&totalMin===0?'有打卡但都没记分钟 → 格子仍会亮，标题显示「已打卡 N 次」':'正常'},
      孤儿条数:findOrphanCheckins().length
    };
  },
  /* 主题自检：一次给出「用户的选择值 / 实际生效值 / 落在 html 上的属性 /
     关键令牌的最终取值」。排查「某处颜色在暗色下看不清」时，
     先看这几个令牌算出来的到底是什么色，比在 CSS 里翻半天快得多。 */
  theme:function(){
    var root=document.documentElement,cs=getComputedStyle(root);
    var keys=['--bg','--card','--surface-2','--text','--muted','--border','--primary','--primary-bg',
              '--success','--success-bg','--danger','--danger-bg','--amber','--amber-bg',
              '--heat-0','--heat-4','--header-from','--toast-bg','--toast-text'];
    var tokens={};
    keys.forEach(function(k){tokens[k]=cs.getPropertyValue(k).trim()});
    return{
      选择:themeMode(),
      实际:themeEffective(),
      html属性:root.getAttribute('data-theme'),
      系统偏好:(_mql&&_mql.matches)?'dark':'light',
      已存localStorage:(function(){try{return localStorage.getItem(THEME_KEY)}catch(e){return'(不可读)'}})(),
      令牌:tokens
    };
  },
  /* 动效自检：确认按钮动效层真的生效 —— 曲线/时长解析出来是什么、
     按钮有没有被裁切（涟漪靠它才不会溢出到按钮外）、系统是否开了「减少动效」。
     ⚠️ 系统开了「减少动效」时，涟漪与 spinner 会被主动隐藏，这是**预期行为**；
        排查「点按钮怎么没波纹」之前先看这个字段，别一头扎进 CSS 里找。 */
  motion:function(){
    var cs=getComputedStyle(document.documentElement);
    var b=document.querySelector('.btn');
    var bs=b?getComputedStyle(b):null;
    return{
      弹簧曲线:cs.getPropertyValue('--ease-spring').trim()||'(未定义)',
      按压时长:cs.getPropertyValue('--motion-press').trim()||'(未定义)',
      系统减少动效:!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches),
      按钮过渡属性:bs?bs.transitionProperty:'(页面上当前没有 .btn)',
      按钮过渡曲线:bs?bs.transitionTimingFunction:'(页面上当前没有 .btn)',
      按钮已裁切:bs?bs.overflow:'(页面上当前没有 .btn)',
      待回弹目标:S._popId,
      忙碌中按钮数:document.querySelectorAll('.btn.is-busy').length
    };
  },
  /* 备注功能自检（第十二阶段）：一次给出「数据里有什么 / 界面上渲染了什么」。
     专治「我明明写了备注，怎么列表里没看到」——先看「原始备注清单」就能分清是
     ① 没写进库（数据侧问题），还是 ② 写进去了但某个展示位没渲染（渲染侧问题）。
     这与 weekCheck 的分工一致：那个管「打卡记录」，这个管「备注」。
     另外「备注字段在数据里」是专门给「字段类型不匹配 → 服务端静默丢字段」留的探针：
     若为 false，说明读回来的记录里根本没有备注这个 key，界面怎么写都不会显示。 */
  noteCheck:function(){
    var tk=todayKey();
    var withNote=S.checkins.filter(function(c){return noteOf(c)});
    var log=document.getElementById('study-log');
    return {
      备注字段在数据里:!!(S.checkins.length&&('备注' in S.checkins[0])),
      全表条数:S.checkins.length,
      有备注条数:withNote.length,
      今天有备注条数:withNote.filter(function(c){return dkey(parseDate(c['日期']))===tk}).length,
      原始备注清单:withNote.map(function(c){
        var g=goalById(c['目标ID']);
        return {目标:g?g['目标名称']:'(已删目标)',日期:dkey(parseDate(c['日期'])),备注:noteOf(c)};
      }),
      界面渲染:{
        今日页备注行:document.querySelectorAll('#tab-today .rec-note').length,
        本周明细备注行:document.querySelectorAll('#week-records .rec-note').length,
        学习日志条数:log?log.querySelectorAll('.log-item').length:'(未渲染该Tab)',
        学习日志备注条数:log?log.querySelectorAll('.log-note:not(.is-empty)').length:'(未渲染该Tab)',
        备注输入框数:document.querySelectorAll('#tab-today textarea[id^=note_]').length,
        编辑弹窗打开:!!document.getElementById('en_note')
      }
    };
  }
};

})();
</script>
<!-- 本地模式下的数据备份 / 迁移入口。
     页面主脚本包在 IIFE 里且是严格模式，外部拿不到内部函数，
     所以这里只用 DOM + window.__SGT_LOCAL__ 做事，不碰业务代码。 -->
<script>
(function(){
'use strict';
var L=window.__SGT_LOCAL__;
if(!L)return;
var CARD_ID='sgt-backup-card';
/* 「我的」页每次进入都会 innerHTML 整块重渲染，注入的卡片会被冲掉。
   用 MutationObserver 盯着，重建一次补一次，比改业务代码安全。 */
var injecting=false;
function cardHTML(){
  return '<div class="card card-body" id="'+CARD_ID+'" style="margin-top:12px">'+
    '<div style="font-size:15px;font-weight:600;margin-bottom:6px">备份与迁移</div>'+
    '<div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:12px">'+
      '数据只存在这台设备的浏览器里。换设备、换浏览器、清理浏览数据都会丢，'+
      '建议每隔一段时间导出一份 JSON 保存到网盘或邮箱。</div>'+
    '<button class="btn btn-outline btn-block" style="margin-bottom:8px" data-sgt-act="export">'+
      '导出备份（JSON）</button>'+
    '<button class="btn btn-outline btn-block" style="margin-bottom:8px" data-sgt-act="import">'+
      '从备份导入</button>'+
    '<input type="file" id="sgt-import-file" accept=".json,application/json" style="display:none"/>'+
    '<button class="btn btn-outline btn-block" data-sgt-act="reseed">恢复示例数据</button>'+
    '<div class="tiny" style="padding:8px 0 0">导入会<b>覆盖</b>当前设备上的全部目标与打卡记录，请先导出留底。</div>'+
    '<div id="sgt-backup-msg" class="tiny" style="padding:6px 0 0"></div>'+
  '</div>';
}
function ensure(){
  var mine=document.getElementById('tab-mine');
  if(!mine)return;
  if(mine.querySelector('#'+CARD_ID))return;
  injecting=true;
  try{mine.insertAdjacentHTML('beforeend',cardHTML())}catch(e){}
  injecting=false;
}
function msg(t){
  var el=document.getElementById('sgt-backup-msg');
  if(el)el.textContent=t||'';
}
function stamp(){
  var d=new Date(),p=function(n){return String(n).length<2?'0'+n:String(n)};
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());
}
function doExport(){
  var data={format:'sgt-local-backup',version:1,exportedAt:new Date().toISOString(),tables:{}};
  ['goals','checkins','weeklies'].forEach(function(k){
    data.tables[L.ids[k]]=L.read(L.ids[k]);
  });
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='学习目标管理台-备份-'+stamp()+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  msg('已导出，文件名：'+a.download);
}
function doImport(file){
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var o=JSON.parse(String(fr.result));
      var t=o&&o.tables;
      if(!t)throw new Error('不是有效的备份文件');
      var ok=false;
      ['goals','checkins','weeklies'].forEach(function(k){
        var id=L.ids[k];
        if(Object.prototype.toString.call(t[id])==='[object Array]'){
          L.write(id,t[id]);ok=true;
        }
      });
      if(!ok)throw new Error('备份文件里没有可识别的数据表');
      msg('导入完成，正在刷新…');
      if(typeof window.loadAll==='function')window.loadAll();
    }catch(e){msg('导入失败：'+(e&&e.message||e))}
  };
  fr.onerror=function(){msg('读取文件失败')};
  fr.readAsText(file);
}
/* 事件委托：卡片会被反复重建，绑在元素上的监听会随 DOM 一起丢，
   挂在 document 上一次绑定即可长期有效。 */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-sgt-act]'):null;
  if(!el)return;
  var act=el.getAttribute('data-sgt-act');
  if(act==='export'){doExport();return}
  if(act==='import'){
    var f=document.getElementById('sgt-import-file');
    if(f)f.click();
    return;
  }
  if(act==='reseed'){
    if(!window.confirm('会清空当前全部数据并重新写入示例目标，确定继续？'))return;
    L.reseed();
    if(typeof window.loadAll==='function')window.loadAll();
    msg('已恢复示例数据');
  }
});
document.addEventListener('change',function(e){
  if(!e.target||e.target.id!=='sgt-import-file')return;
  var f=e.target.files&&e.target.files[0];
  if(f)doImport(f);
  e.target.value='';
});
function boot(){
  var mine=document.getElementById('tab-mine');
  if(!mine){setTimeout(boot,120);return}
  if(window.MutationObserver){
    var mo=new MutationObserver(function(){
      if(injecting)return;
      ensure();
    });
    mo.observe(mine,{childList:true});
  }
  ensure();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>
